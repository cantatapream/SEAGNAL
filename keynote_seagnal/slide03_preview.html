<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SEA:GNAL — 슬라이드 03 (흩어진 출처)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;color:#fff;overflow:hidden;height:100%;}
  *{box-sizing:border-box;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;width:1920px;height:1080px;transform-origin:center;flex-shrink:0;background:#000;overflow:hidden;}

  .chap{position:absolute;left:120px;top:80px;color:#FF6B35;font-size:22px;letter-spacing:0.32em;font-weight:600;}
  .headline{position:absolute;left:120px;top:140px;width:1680px;color:#FFFFFF;font-size:64px;font-weight:600;letter-spacing:-0.025em;line-height:1.2;}
  .headline .em{color:#FF6B35;}
  .accent{position:absolute;left:120px;top:240px;width:80px;height:6px;background:#FF6B35;}
  .subhead{position:absolute;left:120px;top:280px;width:1680px;color:rgba(255,255,255,0.65);font-size:28px;font-weight:300;letter-spacing:-0.01em;line-height:1.4;}
  .foot{position:absolute;left:120px;bottom:50px;right:120px;color:rgba(255,255,255,0.55);font-size:22px;font-weight:500;letter-spacing:0.02em;line-height:1.4;}
  .foot .em{color:#FF6B35;font-weight:600;}

  /* GRAPH */
  #graph-svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;}

  .node{position:absolute;display:flex;align-items:center;justify-content:center;text-align:center;border-radius:50%;font-weight:600;line-height:1.2;letter-spacing:-0.015em;will-change:transform,left,top;}

  #center{
    width:200px;height:200px;
    background:radial-gradient(circle at 32% 30%, #FF9866 0%, #FF6B35 55%, #C9430E 100%);
    color:#FFFFFF;
    font-size:36px;
    font-weight:700;
    letter-spacing:-0.02em;
    box-shadow:0 0 70px rgba(255,107,53,0.45), inset 0 0 30px rgba(255,255,255,0.18);
    z-index:20;
    left:960px;top:660px;
    transform:translate(-50%,-50%);
  }
  #center::after{
    content:'';position:absolute;inset:-8px;border-radius:50%;
    border:1px solid rgba(255,107,53,0.35);
    animation:halo 4s ease-in-out infinite;
  }
  @keyframes halo{0%,100%{transform:scale(1);opacity:0.55;}50%{transform:scale(1.06);opacity:0.25;}}

  .node.outer{
    width:140px;height:140px;
    background:radial-gradient(circle at 32% 30%, rgba(255,107,53,0.22), rgba(255,107,53,0.04));
    border:1.5px solid rgba(255,107,53,0.55);
    color:#FFFFFF;
    font-size:19px;
    z-index:10;
  }

  #steps{position:fixed;right:24px;bottom:24px;color:rgba(255,255,255,0.4);font-size:12px;letter-spacing:0.16em;font-weight:500;z-index:200;}
</style>
</head>
<body>
<div id="stage"><div id="wrap">

  <div class="chap">왜 만들었나 · 흩어진 출처</div>
  <div class="headline">한 바다, <span class="em">일곱 출처.</span></div>
  <div class="accent"></div>
  <div class="subhead">같은 바다 정보인데 — 기관마다, 플랫폼마다, 따로 흩어져 있습니다.</div>

  <svg id="graph-svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
    <line id="line0" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
    <line id="line1" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
    <line id="line2" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
    <line id="line3" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
    <line id="line4" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
    <line id="line5" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
    <line id="line6" stroke="rgba(255,255,255,0.22)" stroke-width="1.4"/>
  </svg>

  <div class="node" id="center">해양 정보</div>

  <div class="node outer" id="node0">기상청</div>
  <div class="node outer" id="node1">국립<br>해양조사원</div>
  <div class="node outer" id="node2">한국<br>천문연구원</div>
  <div class="node outer" id="node3">해양기상<br>기후포털</div>
  <div class="node outer" id="node4">방재기상<br>플랫폼</div>
  <div class="node outer" id="node5">지자체<br>정보</div>
  <div class="node outer" id="node6">기타</div>

  <div class="foot">흩뿌려진 신호를 — <span class="em">한 화면으로</span> 묶는 일. SEA:GNAL의 출발점입니다.</div>

</div></div>

<div id="steps">유기적 호흡 애니메이션 · 7개 공공 출처 · 단일 슬라이드</div>

<script>
  const CX = 960, CY = 660;
  const BASE_DIST = 290;
  const N = 7;
  const CENTER_R = 100;
  const NODE_R = 70;

  const nodes = [];
  for(let i = 0; i < N; i++){
    const angle = (i / N) * Math.PI * 2 - Math.PI / 2; // start at top
    nodes.push({
      angle,
      distPhase: i * 0.97,
      distFreq: 0.0006 + (i % 3) * 0.00009,
      distAmp: 18 + (i % 4) * 4,
      scalePhase: i * 1.31 + 0.6,
      scaleFreq: 0.00075 + ((i+1) % 4) * 0.00008,
      scaleAmp: 0.06 + ((i+1) % 3) * 0.015
    });
  }

  function frame(t){
    for(let i = 0; i < N; i++){
      const n = nodes[i];
      const distBreath = Math.sin(t * n.distFreq + n.distPhase) * n.distAmp;
      const scaleBreath = 1 + Math.sin(t * n.scaleFreq + n.scalePhase) * n.scaleAmp;
      const dist = BASE_DIST + distBreath;
      const x = CX + Math.cos(n.angle) * dist;
      const y = CY + Math.sin(n.angle) * dist;

      const node = document.getElementById('node' + i);
      if(node){
        node.style.left = x + 'px';
        node.style.top = y + 'px';
        node.style.transform = 'translate(-50%,-50%) scale(' + scaleBreath + ')';
      }

      const line = document.getElementById('line' + i);
      if(line){
        // line starts at edge of center, ends at edge of outer node
        const startX = CX + Math.cos(n.angle) * CENTER_R;
        const startY = CY + Math.sin(n.angle) * CENTER_R;
        const r = NODE_R * scaleBreath;
        const endX = x - Math.cos(n.angle) * r;
        const endY = y - Math.sin(n.angle) * r;
        line.setAttribute('x1', startX);
        line.setAttribute('y1', startY);
        line.setAttribute('x2', endX);
        line.setAttribute('y2', endY);
      }
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  function fit(){
    const w = window.innerWidth, h = window.innerHeight;
    const s = Math.min(w/1920, h/1080);
    document.getElementById('wrap').style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
