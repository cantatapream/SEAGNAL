<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;background:#e3ebf3;}
#card{width:1280px;background:linear-gradient(180deg,#eef3f8,#e3ebf3);padding:54px 52px 50px;}
.h{display:flex;align-items:center;gap:20px;}
.h .no{background:#FF6B35;color:#fff;font-weight:800;font-size:42px;border-radius:15px;padding:7px 20px;box-shadow:0 6px 18px rgba(255,107,53,.35);}
.h .t{color:#15243a;font-size:50px;font-weight:800;letter-spacing:-.03em;}
.sub{color:#5b6b80;font-size:24px;font-weight:500;margin:14px 0 30px 2px;letter-spacing:-.01em;}
.sub b{color:#FF6B35;font-weight:700;}

/* 사진 3장 가로 배치 */
.row3{display:flex;gap:28px;align-items:flex-start;}
.col3{flex:1;display:flex;flex-direction:column;align-items:center;}
.chip3{display:inline-flex;align-items:center;gap:11px;background:rgba(255,107,53,.12);border:1px solid rgba(255,107,53,.28);border-radius:24px;padding:9px 20px 9px 11px;margin-bottom:18px;}
.chip3 .cn{flex:0 0 30px;width:30px;height:30px;border-radius:50%;background:#FF6B35;color:#fff;font-size:18px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.chip3 .ct{color:#15243a;font-size:23px;font-weight:800;letter-spacing:-.02em;white-space:nowrap;}
.phone{border:8px solid #1b2536;border-radius:30px;background:#1b2536;box-shadow:0 14px 34px rgba(20,30,55,.28);overflow:hidden;}
.phone img{display:block;height:620px;width:auto;border-radius:22px;}

/* 사진 아래 주요 내용 (자간 좁혀 한 줄) */
.keys{width:100%;margin-top:22px;display:flex;flex-direction:column;gap:12px;}
.key{position:relative;padding-left:21px;color:#5b6b80;font-size:18.5px;font-weight:500;line-height:1.4;letter-spacing:-.03em;white-space:nowrap;}
.key::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:50%;background:#FF6B35;}
.key b{color:#15243a;font-weight:700;}
.key .o{color:#FF6B35;font-weight:700;}
</style></head><body>
<div id="card">
 <div class="h"><span class="no">03</span><span class="t">어떻게 보이나</span></div>
 <div class="sub">앱 화면 그대로 — <b>한 화면에서 보고 · 확인</b>합니다</div>

 <div class="row3">
   <div class="col3">
     <div class="chip3"><span class="cn">1</span><span class="ct">특보정보</span></div>
     <div class="phone"><img src="screens/how_1.jpg"></div>
     <div class="keys">
       <div class="key">특보구역별 <b>기상·시각·부이·예보</b>를 한 화면에</div>
       <div class="key"><span class="o">특보 발표 즉시</span> 휴대폰에 알림</div>
     </div>
   </div>

   <div class="col3">
     <div class="chip3"><span class="cn">2</span><span class="ct">해양종합정보 지도</span></div>
     <div class="phone"><img src="screens/how_2.jpg"></div>
     <div class="keys">
       <div class="key"><b>풍향·속 · 유향·속 · 파고</b> 시각화</div>
       <div class="key"><b>특보 구역</b> · <b>기상부이 위치</b> 표출</div>
     </div>
   </div>

   <div class="col3">
     <div class="chip3"><span class="cn">3</span><span class="ct">임의 해점 종합정보</span></div>
     <div class="phone"><img src="screens/how_3.jpg"></div>
     <div class="keys">
       <div class="key">임의 해점 클릭 → <span class="o">통합 해양정보 13개</span></div>
       <div class="key">조석·파고·바람·수온·수심·천문 등</div>
     </div>
   </div>
 </div>
</div>
</body></html>
