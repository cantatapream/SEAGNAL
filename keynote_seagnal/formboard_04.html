<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;}
html,body{font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;background:#e3ebf3;}
#card{width:1280px;background:linear-gradient(180deg,#eef3f8,#e3ebf3);padding:54px 52px 50px;}
.h{display:flex;align-items:center;gap:20px;}
.h .no{background:#FF6B35;color:#fff;font-weight:800;font-size:42px;border-radius:15px;padding:7px 20px;box-shadow:0 6px 18px rgba(255,107,53,.35);}
.h .t{color:#15243a;font-size:50px;font-weight:800;letter-spacing:-.03em;}
.sub{color:#5b6b80;font-size:24px;font-weight:500;margin:14px 0 32px 2px;letter-spacing:-.01em;}
.sub b{color:#FF6B35;font-weight:700;}
.cardbox{background:#fff;border-radius:22px;box-shadow:0 10px 30px rgba(30,50,80,.08);border:1px solid #d8e2ee;}

.mrow{display:flex;gap:22px;}
.mcard{flex:1;padding:34px 28px 30px;display:flex;flex-direction:column;min-height:230px;}
.mcard .big{color:#FF6B35;font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;display:flex;align-items:baseline;}
.mcard .big .u{color:#15243a;font-size:30px;font-weight:700;margin-left:5px;letter-spacing:-.02em;}
.mcard .lbl{color:#15243a;font-size:26px;font-weight:800;margin-top:20px;letter-spacing:-.02em;}
.mcard .note{color:#93a2b5;font-size:17px;font-weight:500;margin-top:auto;padding-top:14px;letter-spacing:-.01em;line-height:1.4;}

.impact{display:flex;align-items:center;gap:24px;margin-top:24px;padding:28px 34px;border:1px solid rgba(255,107,53,.3);border-radius:20px;background:linear-gradient(150deg,rgba(255,107,53,.1),rgba(255,107,53,.02));}
.impact .ic{flex:0 0 70px;height:70px;border-radius:18px;background:rgba(255,107,53,.14);display:flex;align-items:center;justify-content:center;font-size:38px;}
.impact .tx{color:#1f3047;font-size:29px;font-weight:600;line-height:1.45;letter-spacing:-.015em;}
.impact .tx b{color:#15243a;font-weight:800;}
.impact .tx .o{color:#FF6B35;font-weight:800;}
.foot{color:#93a2b5;font-size:16px;line-height:1.5;margin-top:22px;}
</style></head><body>
<div id="card">
 <div class="h"><span class="no">04</span><span class="t">그간의 성과</span></div>
 <div class="sub"><b>2025. 3. 30. 출시</b> 후 실서비스 운영 중 — 기획이 아니라 <b>현장에서 검증된 지표</b></div>

 <div class="mrow">
   <div class="cardbox mcard">
     <div class="big">1.5<span class="u">만+</span></div>
     <div class="lbl">누적 이용자</div>
     <div class="note">웹 포함 누적</div>
   </div>
   <div class="cardbox mcard">
     <div class="big">1,351<span class="u">명</span></div>
     <div class="lbl">안드로이드 앱 설치</div>
     <div class="note">해양경찰 자유게시판 홍보 2회</div>
   </div>
   <div class="cardbox mcard">
     <div class="big">24.8<span class="u">만+</span></div>
     <div class="lbl">특보 알림 발송</div>
     <div class="note">발표·발효·해제 즉시 통지</div>
   </div>
   <div class="cardbox mcard">
     <div class="big">1.1<span class="u">만+</span></div>
     <div class="lbl">해양 정보 제공</div>
     <div class="note">최근 1개월 (5. 27.~)</div>
   </div>
 </div>

 <div class="impact">
   <div class="ic">🛟</div>
   <div class="tx">기획이 아닌 <b>이미 검증된 서비스</b> — 민간앱 의존을 줄이는 <span class="o">국산 공공 대안</span>으로 운영 중</div>
 </div>

 <div class="foot">※ 운영 실적은 Google Play Console·서버 집계 기준(2025. 3. 30.~). 본 안은 콘텐츠 시안.</div>
</div>
</body></html>
