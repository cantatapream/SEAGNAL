<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>SEA:GNAL — 슬라이드 04 (그래서 만들었습니다)</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" rel="stylesheet">
<style>
  html,body{margin:0;padding:0;background:#000;font-family:'Pretendard',sans-serif;-webkit-font-smoothing:antialiased;color:#fff;overflow:hidden;height:100%;}
  *{box-sizing:border-box;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  #wrap{position:relative;width:1920px;height:1080px;transform-origin:center;background:#000;overflow:hidden;cursor:pointer;}

  /* 상단 챕터 (t1에서만) */
  .chap{position:absolute;left:120px;top:96px;color:#FF6B35;font-size:22px;letter-spacing:0.32em;font-weight:600;opacity:0;transition:opacity 0.6s ease 0.5s;}
  #wrap.t1 .chap{opacity:1;}

  /* 헤드라인 블록 — t0: 가운데 크게 / t1: 좌상단 정위치로 축소·이동 */
  #headblock{position:absolute;left:120px;top:152px;transform-origin:left top;transition:transform 0.9s cubic-bezier(0.33,0,0.2,1);}
  #wrap.t0 #headblock{transform:translate(300px,300px) scale(1.5);}
  #wrap.t1 #headblock{transform:translate(0,0) scale(1);}
  .hb-main{color:#FFFFFF;font-size:68px;font-weight:600;letter-spacing:-0.028em;line-height:1.2;}
  .hb-sub{color:rgba(255,255,255,0.78);font-size:38px;font-weight:300;letter-spacing:-0.015em;line-height:1.3;margin-top:16px;}
  .hb-sub .em{color:#FF6B35;font-weight:600;}
  .hb-accent{width:80px;height:6px;background:#FF6B35;margin-top:34px;}

  /* 두 가지 중점 — t1에서 등장 */
  #points{position:absolute;left:120px;top:560px;width:1680px;display:flex;gap:60px;}
  .pt{flex:1;padding:50px 52px;border:1px solid rgba(255,255,255,0.18);border-radius:16px;
    opacity:0;transform:translateY(28px);transition:opacity 0.7s ease,transform 0.7s cubic-bezier(0.34,1.2,0.5,1);}
  .pt.right{border-color:rgba(255,107,53,0.45);background:rgba(255,107,53,0.05);}
  #wrap.t1 .pt{opacity:1;transform:translateY(0);}
  #wrap.t1 .pt.left{transition-delay:0.85s;}
  #wrap.t1 .pt.right{transition-delay:1.05s;}
  .pt-no{color:#FF6B35;font-size:26px;letter-spacing:0.2em;font-weight:600;}
  .pt-title{color:#FFFFFF;font-size:64px;font-weight:700;letter-spacing:-0.03em;line-height:1.1;margin-top:24px;}
  .pt-desc{color:rgba(255,255,255,0.62);font-size:26px;font-weight:300;letter-spacing:-0.01em;line-height:1.4;margin-top:24px;}
  .pt-desc .em{color:rgba(255,255,255,0.92);font-weight:500;}

  .foot{position:absolute;left:120px;bottom:56px;right:120px;color:rgba(255,255,255,0.5);font-size:22px;font-weight:500;letter-spacing:0.02em;opacity:0;transition:opacity 0.6s ease 1.3s;}
  #wrap.t1 .foot{opacity:1;}
  .foot .em{color:#FF6B35;font-weight:600;}

  #steps{position:fixed;right:24px;bottom:24px;color:rgba(255,255,255,0.4);font-size:12px;letter-spacing:0.16em;font-weight:500;z-index:200;}
</style>
</head>
<body>
<div id="stage"><div id="wrap" class="t0">

  <div class="chap">그래서 만들었습니다 · 두 가지 원칙</div>

  <div id="headblock">
    <div class="hb-main">그래서 만들었습니다.</div>
    <div class="hb-sub">다음과 같은 <span class="em">두 가지 원칙</span>으로.</div>
    <div class="hb-accent"></div>
  </div>

  <div id="points">
    <div class="pt left">
      <div class="pt-no">원칙 ①</div>
      <div class="pt-title">한 개의 앱에</div>
      <div class="pt-desc">흩어진 <span class="em">7개+ 공공 출처</span>를 —<br>하나의 화면에 모두 담는다.</div>
    </div>
    <div class="pt right">
      <div class="pt-no">원칙 ②</div>
      <div class="pt-title">3회 터치 이내</div>
      <div class="pt-desc">원하는 정보까지 —<br><span class="em">3번 안에</span> 닿게 한다.</div>
    </div>
  </div>

  <div class="foot">복잡한 바다 정보를 — <span class="em">가장 단순한 신호로.</span></div>

</div></div>

<div id="steps">1 / 2 · 그래서 만들었습니다 · 자동 전환 · CLICK 으로 즉시</div>

<script>
  const wrap = document.getElementById('wrap');
  const steps = document.getElementById('steps');
  let t = 0;
  const labels = ['그래서 만들었습니다 (가운데)', '두 가지 원칙 (좌·우)'];
  let autoTimer = null;
  function setT(n){
    t = Math.max(0, Math.min(1, n));
    wrap.classList.remove('t0','t1');
    wrap.classList.add('t' + t);
    steps.textContent = (t+1) + ' / 2 · ' + labels[t] + ' · CLICK 으로 다음';
    if(t === 1 && autoTimer){ clearTimeout(autoTimer); autoTimer = null; }
  }
  setT(0);
  // 자동 전환 (가운데 → 좌상단 + 두 원칙)
  autoTimer = setTimeout(() => setT(1), 2300);

  wrap.addEventListener('click', () => {
    if(t < 1) setT(1);
  });
  document.addEventListener('keydown', e => {
    if(e.key === ' ' || e.key === 'ArrowRight' || e.key === 'Enter'){ if(t < 1) setT(1); e.preventDefault(); }
    else if(e.key === 'ArrowLeft'){ if(t > 0) setT(0); e.preventDefault(); }
    else if(e.key === 'r' || e.key === 'R'){ if(autoTimer) clearTimeout(autoTimer); setT(0); autoTimer = setTimeout(()=>setT(1),2300); }
  });

  function fit(){
    const w = window.innerWidth, h = window.innerHeight;
    const s = Math.min(w/1920, h/1080);
    wrap.style.transform = 'scale(' + s + ')';
  }
  window.addEventListener('resize', fit);
  fit();
</script>
</body>
</html>
