let cur = 0;

function buildToc(){
  const toc = document.getElementById('toc');
  const h = document.createElement('h3');
  h.textContent = '발표 슬라이드 · 12장';
  toc.appendChild(h);
  slides.forEach((s, i) => {
    const it = document.createElement('div');
    it.className = 'tocItem';
    it.dataset.idx = i;
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = String(i+1).padStart(2,'0');
    const lbl = document.createElement('span');
    lbl.textContent = s.label.replace(/^\d+\s*·\s*/, '');
    it.appendChild(num); it.appendChild(lbl);
    it.onclick = () => { go(parseInt(it.dataset.idx)); document.getElementById('toc').classList.remove('show'); };
    toc.appendChild(it);
  });
}

function go(i){
  cur = i;
  const s = slides[i];
  document.getElementById('frame').srcdoc = s.html;
  document.getElementById('slideLabel').textContent = s.label;
  document.getElementById('counter').textContent = (i+1) + ' / ' + slides.length;
  document.querySelector('#progress div').style.width = ((i+1)/slides.length*100) + '%';
  document.querySelectorAll('.tocItem').forEach(el => el.classList.toggle('active', parseInt(el.dataset.idx) === i));
  location.hash = '#' + (i+1);
}

function fit(){
  const w = window.innerWidth, h = window.innerHeight;
  const s = Math.min(w/1920, h/1080);
  document.getElementById('frameWrap').style.transform = 'scale(' + s + ')';
}

window.addEventListener('resize', fit);
window.addEventListener('keydown', e => {
  if(e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown'){ if(cur < slides.length-1) go(cur+1); e.preventDefault(); }
  else if(e.key === 'ArrowLeft' || e.key === 'PageUp'){ if(cur > 0) go(cur-1); e.preventDefault(); }
  else if(e.key === 'Home'){ go(0); }
  else if(e.key === 'End'){ go(slides.length-1); }
  else if(e.key.toLowerCase() === 'm'){ document.getElementById('toc').classList.toggle('show'); }
  else if(e.key.toLowerCase() === 'f'){
    if(!document.fullscreenElement) document.documentElement.requestFullscreen();
    else document.exitFullscreen();
  }
});

let timer;
document.addEventListener('mousemove', () => {
  document.getElementById('topbar').classList.add('show');
  clearTimeout(timer);
  timer = setTimeout(() => document.getElementById('topbar').classList.remove('show'), 2000);
});

buildToc();
const m = location.hash.match(/^#(\d+)$/);
go(m ? Math.max(0, Math.min(slides.length-1, parseInt(m[1])-1)) : 0);
fit();
</script>
</body>
</html>
