# fly.toml app configuration file generated for seagnal-server on 2025-12-30T22:42:28+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'seagnal-server'
primary_region = 'sin'

[[mounts]]
  source = 'seagnal_data'
  destination = '/app/local_server/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
