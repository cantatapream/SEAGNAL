# fly.toml app configuration file generated for seagnal-server on 2025-12-30T22:42:28+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'seagnal-server'
primary_region = 'nrt'

[env]
  # [1회용 — 검증 후 즉시 제거할 것]
  # 시간대(TZ) 버그 수정 후 첫 배포에서 dmdw 백필을 강제 재실행하기 위한 플래그.
  # dmdw_warn_crawler.js 의 runBackfill() 이 디스크의 backfillReady=true 를 무시하고
  # KST 기준 24시간치 EF/FC 를 다시 훑게 만든다. 새 백필 푸시 정책에 의해 "최근 12h
  # 안에 발생한 자식 변화" 만 enqueue/flush 되어 운영자에게 정상 발송됨.
  #
  # ⚠️  검증 완료 후 이 줄을 반드시 삭제하고 재배포할 것 — 자동 self-clear 없음.
  #     영구 유지 시 매 머신 재시작/스케일링마다 24시간치 백필이 반복 실행되어
  #     dmdw API 부담 + 푸시 폭주(특히 안전망 미발동 구간) 위험.
  SERVER_RESTART_FORCE_REBACKFILL = "1"

[[mounts]]
  source = 'seagnal_data'
  destination = '/app/local_server/data'

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  # [VM 사이즈 — shared-cpu-2x / 1GB]
  #   - cpus = 2 (shared) — 동시 요청 처리량 30-50% 개선 (libuv 워커풀,
  #     GC 백그라운드 스레드가 추가 vCPU 활용).
  #   - 메모리 1GB — 이전 512MB 에서 OOM 발생 사례 있어 증액.
  #     OOM 원인: lazy 로드된 SDK들(firebase-admin/cloudinary/GCS/Gemini)이
  #     누적 + 트래픽 증가 + 큰 응답(zone_forecasts.json 5.85MB) 압축 버퍼
  #     누적으로 512MB 한계 초과.
  #     1GB 면 평상시 ~300MB 사용 + 안전 마진 700MB 확보.
  #   - 비용 영향: 월 약 $3.89 → $6.39 (shared-cpu-2x 1GB 기준, +$2.50/월).
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 1024
