<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경도/위도 격자 그리기 도구</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #1a1a2e;
            color: #eee;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 380px;
            background: linear-gradient(180deg, #16213e 0%, #1a1a2e 100%);
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            border-right: 1px solid #0f3460;
            overflow-y: auto;
        }

        h2 {
            margin: 0 0 5px 0;
            font-size: 1.1rem;
            color: #e94560;
        }

        .control-group {
            background: rgba(15, 52, 96, 0.5);
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #0f3460;
        }

        label {
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            color: #aaa;
        }

        select,
        input[type="number"] {
            width: 100%;
            padding: 8px 10px;
            background: #0f0f23;
            border: 1px solid #0f3460;
            color: #fff;
            border-radius: 6px;
            margin-bottom: 6px;
        }

        select:focus,
        input:focus {
            outline: none;
            border-color: #e94560;
        }

        button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #e94560, #0f3460);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            margin-top: 5px;
            transition: transform 0.1s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(233, 69, 96, 0.3);
        }

        button.secondary {
            background: #333;
        }

        button.secondary:hover {
            background: #444;
            box-shadow: none;
        }

        button.active {
            background: linear-gradient(135deg, #2ecc71, #27ae60);
        }

        .mode-badge {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .mode-lon {
            background: #3498db;
            color: white;
        }

        .mode-lat {
            background: #e74c3c;
            color: white;
        }

        .grid-list {
            max-height: 200px;
            overflow-y: auto;
            background: #0f0f23;
            border: 1px solid #0f3460;
            border-radius: 6px;
            padding: 5px;
            font-size: 0.75rem;
            font-family: monospace;
        }

        .grid-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #16213e;
            padding: 4px 8px;
            margin-bottom: 3px;
            border-radius: 4px;
        }

        .grid-item.lon {
            border-left: 3px solid #3498db;
        }

        .grid-item.lat {
            border-left: 3px solid #e74c3c;
        }

        .grid-item .remove-btn {
            background: transparent;
            color: #e94560;
            width: auto;
            padding: 2px 6px;
            margin: 0;
            font-size: 0.9rem;
        }

        .progress-bar {
            height: 6px;
            background: #0f0f23;
            border-radius: 3px;
            overflow: hidden;
            margin-top: 5px;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #2ecc71, #27ae60);
            transition: width 0.3s;
        }

        .log-area {
            flex: 1;
            min-height: 100px;
            background: #0f0f23;
            border: 1px solid #0f3460;
            color: #0f0;
            font-family: 'Consolas', monospace;
            padding: 10px;
            font-size: 0.7rem;
            overflow-y: auto;
            white-space: pre-wrap;
            border-radius: 6px;
        }

        .hint-text {
            font-size: 0.75rem;
            color: #888;
            margin-top: 5px;
            line-height: 1.4;
        }

        .canvas-container {
            flex: 1;
            position: relative;
            background: #0a0a0a;
            overflow: hidden;
            cursor: crosshair;
        }

        #main-canvas {
            display: block;
            transform-origin: 0 0;
        }

        #mode-indicator {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 0.9rem;
            z-index: 100;
            border: 2px solid #3498db;
            color: #3498db;
        }

        #mode-indicator.lat-mode {
            border-color: #e74c3c;
            color: #e74c3c;
        }

        .coord-display {
            position: absolute;
            bottom: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            color: #fff;
            z-index: 100;
        }

        .shortcut-hint {
            position: absolute;
            bottom: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: #888;
            z-index: 100;
        }

        .shortcut-hint kbd {
            background: #333;
            padding: 2px 6px;
            border-radius: 3px;
            margin: 0 2px;
        }

        .current-value {
            font-size: 1.5rem;
            font-weight: bold;
            text-align: center;
            padding: 15px;
            background: #0f0f23;
            border-radius: 8px;
            margin: 10px 0;
        }

        .current-value.lon {
            color: #3498db;
        }

        .current-value.lat {
            color: #e74c3c;
        }
    </style>
</head>

<body>

    <div class="sidebar">
        <h2>📐 경도/위도 격자 그리기</h2>

        <div class="control-group">
            <label>1. 모드 선택</label>
            <div style="display:flex; gap:5px;">
                <button id="btn-lon-mode" class="active" onclick="setMode('lon')">📏 경도 (세로선)</button>
                <button id="btn-lat-mode" class="secondary" onclick="setMode('lat')">📐 위도 (가로선)</button>
            </div>

            <label style="margin-top:15px;">2. 현재 그릴 값</label>
            <select id="grid-value-select" onchange="updateCurrentDisplay()">
                <!-- 동적으로 채워짐 -->
            </select>

            <div id="current-value-display" class="current-value lon">119°</div>

            <p class="hint-text">
                🖱️ 지도에서 <b>한 번 클릭</b>하면<br>
                &nbsp;&nbsp;&nbsp;• 경도: 해당 X 위치에 <b>세로선</b><br>
                &nbsp;&nbsp;&nbsp;• 위도: 해당 Y 위치에 <b>가로선</b><br>
                자동으로 생성됩니다.
            </p>
        </div>

        <div class="control-group">
            <label>진행 현황</label>
            <div style="display:flex; justify-content:space-between; margin-bottom:5px;">
                <span style="color:#3498db;">경도: <span id="lon-count">0</span>/43</span>
                <span style="color:#e74c3c;">위도: <span id="lat-count">0</span>/42</span>
            </div>
            <div class="progress-bar">
                <div id="progress-fill" class="progress-bar-fill" style="width:0%"></div>
            </div>

            <label style="margin-top:10px;">그려진 격자</label>
            <div class="grid-list" id="grid-list-container">
                <div style="color:#666;">격자가 없습니다.</div>
            </div>

            <div style="display:flex; gap:5px; margin-top:10px;">
                <button onclick="undoLast()" class="secondary">↩ 실행취소</button>
                <button onclick="clearAll()" class="secondary">🗑️ 전체삭제</button>
            </div>
        </div>

        <button onclick="exportGridData()" style="background:linear-gradient(135deg, #2ecc71, #27ae60);">📤 격자 데이터
            내보내기</button>

        <label>출력 데이터</label>
        <textarea id="log-output" class="log-area" readonly></textarea>
    </div>

    <div class="canvas-container" id="canvas-wrapper">
        <div id="mode-indicator">📏 경도 모드 - 클릭하면 세로선</div>
        <div id="coord-display" class="coord-display">X: -, Y: -</div>
        <div class="shortcut-hint">
            <kbd>↑↓←→</kbd> 이동 | <kbd>L</kbd> 경도 | <kbd>T</kbd> 위도 | <kbd>Ctrl+Z</kbd> 취소
        </div>
        <canvas id="main-canvas"></canvas>
    </div>

    <script>
        // ==========================================
        // 1. 상수 정의
        // ==========================================
        // 경도: 119 ~ 140 (0.5도 간격 = 43개)
        const LON_VALUES = [];
        for (let lon = 119; lon <= 140; lon += 0.5) {
            LON_VALUES.push(lon);
        }

        // 위도: 24.5 ~ 45 (0.5도 간격 = 42개)
        const LAT_VALUES = [];
        for (let lat = 24.5; lat <= 45; lat += 0.5) {
            LAT_VALUES.push(lat);
        }

        // ==========================================
        // 2. 상태 변수
        // ==========================================
        const canvas = document.getElementById('main-canvas');
        const ctx = canvas.getContext('2d');
        const wrapper = document.getElementById('canvas-wrapper');
        const logOutput = document.getElementById('log-output');

        let originalImage = new Image();
        let scale = 1, translateX = 0, translateY = 0;
        let isDragging = false, startDragX, startDragY;

        // 현재 모드: 'lon' 또는 'lat'
        let currentMode = 'lon';

        // 저장된 격자 데이터
        // 경도: X 픽셀값만 저장 (세로선이므로)
        // 위도: Y 픽셀값만 저장 (가로선이므로)
        let gridData = {
            lon: {},  // { "119": 450, "119.5": 480, ... }  (X 좌표)
            lat: {}   // { "24.5": 2500, "25": 2450, ... }  (Y 좌표)
        };

        // ==========================================
        // 3. 초기화
        // ==========================================
        window.onload = function () {
            populateValueSelect();
            updateCurrentDisplay();

            originalImage.src = 'images/haegudo.gif';
            originalImage.onload = () => {
                console.log("Image Loaded:", originalImage.width, originalImage.height);
                canvas.width = originalImage.width;
                canvas.height = originalImage.height;

                redrawCanvas();
                fitToScreen();
                initMouseEvents();
                initKeyboardEvents();
            };

            originalImage.onerror = () => {
                alert("이미지 로드 실패: images/haegudo.gif");
            };
        };

        function populateValueSelect() {
            const select = document.getElementById('grid-value-select');
            select.innerHTML = '';

            const values = currentMode === 'lon' ? LON_VALUES : LAT_VALUES;
            const prefix = currentMode === 'lon' ? '경도' : '위도';

            values.forEach(val => {
                const opt = document.createElement('option');
                opt.value = val;
                const done = gridData[currentMode][val] !== undefined ? '✅ ' : '';
                opt.textContent = `${done}${prefix} ${val}°`;
                select.appendChild(opt);
            });

            // 아직 안 한 첫 번째 값 선택
            for (const val of values) {
                if (gridData[currentMode][val] === undefined) {
                    select.value = val;
                    break;
                }
            }
        }

        function updateCurrentDisplay() {
            const select = document.getElementById('grid-value-select');
            const display = document.getElementById('current-value-display');
            display.textContent = select.value + '°';
            display.className = 'current-value ' + currentMode;
        }

        // ==========================================
        // 4. 모드 전환
        // ==========================================
        function setMode(mode) {
            currentMode = mode;

            const indicator = document.getElementById('mode-indicator');
            const btnLon = document.getElementById('btn-lon-mode');
            const btnLat = document.getElementById('btn-lat-mode');

            if (mode === 'lon') {
                indicator.textContent = '📏 경도 모드 - 클릭하면 세로선';
                indicator.className = '';
                btnLon.className = 'active';
                btnLat.className = 'secondary';
            } else {
                indicator.textContent = '📐 위도 모드 - 클릭하면 가로선';
                indicator.className = 'lat-mode';
                btnLon.className = 'secondary';
                btnLat.className = 'active';
            }

            populateValueSelect();
            updateCurrentDisplay();
            redrawCanvas();
        }

        // ==========================================
        // 5. 격자 저장/삭제
        // ==========================================
        function saveGrid(pixelValue) {
            const select = document.getElementById('grid-value-select');
            const value = select.value;

            if (!value) {
                alert('값을 선택해주세요.');
                return;
            }

            // 경도면 X좌표, 위도면 Y좌표 저장
            gridData[currentMode][value] = Math.round(pixelValue);

            console.log(`✅ ${currentMode === 'lon' ? '경도' : '위도'} ${value}° = ${Math.round(pixelValue)}px`);

            // 다음 값으로 자동 이동
            const values = currentMode === 'lon' ? LON_VALUES : LAT_VALUES;
            const currentIdx = values.indexOf(parseFloat(value));
            if (currentIdx < values.length - 1) {
                // 다음 중 안 한 거 찾기
                for (let i = currentIdx + 1; i < values.length; i++) {
                    if (gridData[currentMode][values[i]] === undefined) {
                        select.value = values[i];
                        break;
                    }
                }
            }

            updateUI();
            populateValueSelect();
            updateCurrentDisplay();
            redrawCanvas();
        }

        function undoLast() {
            const keys = Object.keys(gridData[currentMode]);
            if (keys.length > 0) {
                const lastKey = keys[keys.length - 1];
                delete gridData[currentMode][lastKey];
                updateUI();
                populateValueSelect();
                updateCurrentDisplay();
                redrawCanvas();
            }
        }

        function clearAll() {
            if (confirm('모든 격자 데이터를 삭제하시겠습니까?')) {
                gridData = { lon: {}, lat: {} };
                updateUI();
                populateValueSelect();
                updateCurrentDisplay();
                redrawCanvas();
            }
        }

        function removeGrid(mode, value) {
            delete gridData[mode][value];
            updateUI();
            populateValueSelect();
            updateCurrentDisplay();
            redrawCanvas();
        }

        // ==========================================
        // 6. UI 업데이트
        // ==========================================
        function updateUI() {
            const lonCount = Object.keys(gridData.lon).length;
            const latCount = Object.keys(gridData.lat).length;

            document.getElementById('lon-count').textContent = lonCount;
            document.getElementById('lat-count').textContent = latCount;

            const totalProgress = ((lonCount + latCount) / (LON_VALUES.length + LAT_VALUES.length)) * 100;
            document.getElementById('progress-fill').style.width = totalProgress + '%';

            // 격자 목록 업데이트
            const container = document.getElementById('grid-list-container');
            const allGrids = [];

            Object.entries(gridData.lon).forEach(([val, px]) => {
                allGrids.push({ mode: 'lon', value: val, px });
            });
            Object.entries(gridData.lat).forEach(([val, px]) => {
                allGrids.push({ mode: 'lat', value: val, px });
            });

            if (allGrids.length === 0) {
                container.innerHTML = '<div style="color:#666;">격자가 없습니다.</div>';
            } else {
                container.innerHTML = allGrids.map(g => `
                    <div class="grid-item ${g.mode}">
                        <span>${g.mode === 'lon' ? '경도' : '위도'} ${g.value}° = ${g.px}px</span>
                        <button class="remove-btn" onclick="removeGrid('${g.mode}', '${g.value}')">×</button>
                    </div>
                `).join('');
            }
        }

        // ==========================================
        // 7. 캔버스 렌더링
        // ==========================================
        function redrawCanvas() {
            ctx.drawImage(originalImage, 0, 0);

            // 저장된 경도선 그리기 (파란색 세로선)
            ctx.strokeStyle = 'rgba(52, 152, 219, 0.7)';
            ctx.lineWidth = 1;
            ctx.setLineDash([5, 3]);
            Object.entries(gridData.lon).forEach(([val, x]) => {
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();

                // 라벨
                ctx.fillStyle = '#3498db';
                ctx.font = '12px sans-serif';
                ctx.fillText(val + '°', x + 3, 20);
            });

            // 저장된 위도선 그리기 (빨간색 가로선)
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.7)';
            ctx.lineWidth = 1;
            Object.entries(gridData.lat).forEach(([val, y]) => {
                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();

                // 라벨
                ctx.fillStyle = '#e74c3c';
                ctx.font = '12px sans-serif';
                ctx.fillText(val + '°', 5, y - 3);
            });

            ctx.setLineDash([]);
        }

        // ==========================================
        // 8. 마우스 이벤트
        // ==========================================
        function initMouseEvents() {
            wrapper.addEventListener('wheel', (e) => {
                e.preventDefault();
                const delta = e.deltaY > 0 ? 0.9 : 1.1;
                const newScale = scale * delta;
                if (newScale < 0.1 || newScale > 5) return;

                const rect = wrapper.getBoundingClientRect();
                const mouseX = e.clientX - rect.left;
                const mouseY = e.clientY - rect.top;

                translateX -= (mouseX - translateX) * (delta - 1);
                translateY -= (mouseY - translateY) * (delta - 1);
                scale = newScale;
                updateTransform();
            });

            wrapper.addEventListener('mousedown', (e) => {
                if (e.button === 1 || (e.button === 0 && e.altKey)) {
                    isDragging = true;
                    startDragX = e.clientX - translateX;
                    startDragY = e.clientY - translateY;
                    wrapper.style.cursor = 'grabbing';
                    e.preventDefault();
                }
            });

            wrapper.addEventListener('click', (e) => {
                if (e.altKey) return;

                const pt = getImgPoint(e);
                if (!isValidPt(pt)) return;

                // 경도 모드면 X 좌표, 위도 모드면 Y 좌표 저장
                if (currentMode === 'lon') {
                    saveGrid(pt.x);
                } else {
                    saveGrid(pt.y);
                }
            });

            wrapper.addEventListener('mousemove', (e) => {
                const pt = getImgPoint(e);
                document.getElementById('coord-display').textContent =
                    `X: ${Math.round(pt.x)}, Y: ${Math.round(pt.y)}`;

                if (isDragging) {
                    translateX = e.clientX - startDragX;
                    translateY = e.clientY - startDragY;
                    updateTransform();
                }

                // 미리보기 선 표시
                redrawCanvas();
                ctx.setLineDash([3, 3]);
                ctx.lineWidth = 2;

                if (currentMode === 'lon') {
                    ctx.strokeStyle = 'rgba(52, 152, 219, 0.9)';
                    ctx.beginPath();
                    ctx.moveTo(pt.x, 0);
                    ctx.lineTo(pt.x, canvas.height);
                    ctx.stroke();
                } else {
                    ctx.strokeStyle = 'rgba(231, 76, 60, 0.9)';
                    ctx.beginPath();
                    ctx.moveTo(0, pt.y);
                    ctx.lineTo(canvas.width, pt.y);
                    ctx.stroke();
                }
                ctx.setLineDash([]);
            });

            window.addEventListener('mouseup', () => {
                isDragging = false;
                wrapper.style.cursor = 'crosshair';
            });
        }

        // ==========================================
        // 9. 키보드 이벤트
        // ==========================================
        function initKeyboardEvents() {
            window.addEventListener('keydown', (e) => {
                if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;

                switch (e.key.toLowerCase()) {
                    case 'arrowup': translateY += 50; updateTransform(); break;
                    case 'arrowdown': translateY -= 50; updateTransform(); break;
                    case 'arrowleft': translateX += 50; updateTransform(); break;
                    case 'arrowright': translateX -= 50; updateTransform(); break;
                    case 'l': setMode('lon'); break;
                    case 't': setMode('lat'); break;
                    case 'z': if (e.ctrlKey) undoLast(); break;
                }
            });
        }

        // ==========================================
        // 10. 데이터 내보내기
        // ==========================================
        function exportGridData() {
            const lonCount = Object.keys(gridData.lon).length;
            const latCount = Object.keys(gridData.lat).length;

            if (lonCount === 0 && latCount === 0) {
                alert('저장된 격자 데이터가 없습니다.');
                return;
            }

            // 경도 데이터 정렬 (숫자순)
            const sortedLon = {};
            Object.keys(gridData.lon).sort((a, b) => parseFloat(a) - parseFloat(b)).forEach(key => {
                sortedLon[key] = gridData.lon[key];
            });

            // 위도 데이터 정렬 (숫자순)
            const sortedLat = {};
            Object.keys(gridData.lat).sort((a, b) => parseFloat(a) - parseFloat(b)).forEach(key => {
                sortedLat[key] = gridData.lat[key];
            });

            const output = {
                lon: sortedLon,
                lat: sortedLat
            };

            const jsonStr = `// 경도/위도 격자 캘리브레이션 데이터
// GPS 좌표 → 픽셀 좌표 변환용
// 경도(X): ${lonCount}개, 위도(Y): ${latCount}개
// 이미지 크기: ${canvas.width} x ${canvas.height}

const GRID_CALIBRATION_DATA = ${JSON.stringify(output, null, 4)};
`;

            logOutput.value = jsonStr;

            navigator.clipboard.writeText(jsonStr).then(() => {
                alert(`✅ 격자 데이터가 클립보드에 복사되었습니다!\n\n경도(X): ${lonCount}개\n위도(Y): ${latCount}개`);
            }).catch(() => {
                alert(`✅ 격자 데이터가 출력되었습니다.\n\n경도(X): ${lonCount}개\n위도(Y): ${latCount}개`);
            });
        }

        // ==========================================
        // 11. 유틸리티
        // ==========================================
        function getImgPoint(e) {
            const rect = wrapper.getBoundingClientRect();
            return {
                x: (e.clientX - rect.left - translateX) / scale,
                y: (e.clientY - rect.top - translateY) / scale
            };
        }

        function isValidPt(pt) {
            return pt.x >= 0 && pt.x <= canvas.width && pt.y >= 0 && pt.y <= canvas.height;
        }

        function updateTransform() {
            canvas.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        function fitToScreen() {
            const wrapperW = wrapper.clientWidth;
            const wrapperH = wrapper.clientHeight;
            const scaleX = wrapperW / originalImage.width;
            const scaleY = wrapperH / originalImage.height;
            scale = Math.min(scaleX, scaleY) * 0.9;
            translateX = (wrapperW - originalImage.width * scale) / 2;
            translateY = (wrapperH - originalImage.height * scale) / 2;
            updateTransform();
        }
    </script>
</body>
