<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>특보구역 ↔ 대해구/소해구 매핑 툴 (OpenLayers)</title>

    <!-- OpenLayers (해양종합정보 페이지와 동일 버전) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
            overflow: hidden;
            background: #1a1a2e;
            color: #e0e0e0;
            user-select: none;
        }

        #root { display: flex; flex-direction: column; width: 100%; height: 100%; }

        /* 상단 툴바 */
        #toolbar {
            background: #16213e;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding: 8px 14px;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
            z-index: 5;
        }
        #toolbar h1 {
            font-size: 14px;
            margin: 0;
            color: #4fc3f7;
            margin-right: 8px;
        }
        .mode-toggle { display: inline-flex; border-radius: 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); }
        .mode-toggle button {
            padding: 6px 14px;
            background: #1e2a4a;
            color: #bbb;
            border: none;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .mode-toggle button.active { background: #1976d2; color: white; }
        .btn {
            padding: 6px 12px;
            background: #2d3a5f;
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            font-family: inherit;
        }
        .btn:hover { background: #3d4a6f; }
        .btn.primary { background: #1976d2; border-color: #1976d2; }
        .btn.primary:hover { background: #2186e2; }
        .btn.danger { background: #c62828; border-color: #c62828; }
        .btn.danger:hover { background: #d63838; }
        #status {
            margin-left: auto;
            font-size: 11px;
            color: #888;
        }

        #main { display: flex; flex: 1; overflow: hidden; min-height: 0; }

        /* 좌측 패널 */
        #zone-panel {
            width: 300px;
            min-width: 300px;
            background: #16213e;
            border-right: 1px solid rgba(255,255,255,0.1);
            overflow-y: auto;
            padding: 10px;
        }
        .zone-panel-header {
            font-size: 11px;
            color: #4fc3f7;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-weight: 600;
        }
        .region-group { margin-bottom: 14px; }
        .region-title {
            font-size: 11px;
            color: #888;
            margin-bottom: 4px;
            padding-left: 4px;
        }
        .zone-item {
            padding: 8px 10px;
            margin-bottom: 4px;
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            font-size: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.15s;
        }
        .zone-item:hover { background: rgba(255,255,255,0.08); }
        .zone-item.active {
            background: rgba(255, 193, 7, 0.18);
            border-color: #ffc107;
            color: #ffc107;
        }
        .zone-item.done { opacity: 0.55; }
        .zone-item.done .zone-name::before {
            content: '✓ ';
            color: #4caf50;
            font-weight: bold;
        }
        .zone-item .zone-name { flex: 1; }
        .zone-item .zone-counts {
            font-size: 10px;
            color: #888;
            margin-left: 6px;
        }

        /* 지도 영역 */
        #map-wrap { flex: 1; position: relative; overflow: hidden; background: #0a0a14; }
        #ol-map { position: absolute; inset: 0; }

        /* 정보 박스 */
        #map-info {
            position: absolute;
            left: 14px;
            top: 14px;
            z-index: 10;
            background: rgba(22, 33, 62, 0.92);
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.1);
            font-size: 12px;
            line-height: 1.7;
            min-width: 240px;
            pointer-events: none;
        }
        #map-info .row { display: flex; justify-content: space-between; gap: 12px; }
        #map-info .label { color: #888; }
        #map-info .value { color: #fff; font-weight: 600; }
        #map-info .value.major { color: #ffc107; }
        #map-info .value.small { color: #4fc3f7; }

        /* 토스트 */
        .toast {
            position: fixed;
            top: 60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 118, 210, 0.95);
            color: white;
            padding: 10px 24px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 1000;
            box-shadow: 0 4px 14px rgba(0,0,0,0.4);
            animation: toastIn 0.2s ease;
        }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -10px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }
    </style>
</head>
<body>
<div id="root">
    <div id="toolbar">
        <h1>🗺️ 특보구역 ↔ 해구 매핑 툴</h1>
        <div class="mode-toggle">
            <button id="mode-major" class="active" onclick="setMode('major')">대해구 모드</button>
            <button id="mode-small" onclick="setMode('small')">소해구 모드</button>
        </div>
        <button class="btn" onclick="document.getElementById('upload-input').click()">JSON 업로드</button>
        <input type="file" id="upload-input" accept=".json" style="display:none" onchange="handleUpload(event)">
        <button class="btn primary" onclick="handleDownload()">JSON 다운로드</button>
        <button class="btn danger" onclick="clearCurrent()">현재 구역 초기화</button>
        <span id="status">로딩 중...</span>
    </div>

    <div id="main">
        <div id="zone-panel">
            <div class="zone-panel-header">📍 특보구역 목록</div>
            <div id="zone-list"></div>
        </div>

        <div id="map-wrap">
            <div id="map-info">
                <div class="row"><span class="label">선택 중인 특보구역</span><span class="value" id="info-zone">-</span></div>
                <div class="row"><span class="label">대해구</span><span class="value major" id="info-major-count">0개</span></div>
                <div class="row"><span class="label">소해구</span><span class="value small" id="info-small-count">0개</span></div>
                <div class="row"><span class="label">현재 모드</span><span class="value" id="info-mode">대해구</span></div>
                <div class="row"><span class="label">줌</span><span class="value" id="info-zoom">-</span></div>
            </div>
            <div id="ol-map"></div>
        </div>
    </div>
</div>

<script>
// ============================================================
// 상태
// ============================================================
const STATE = {
    mode: 'major',                  // 'major' | 'small'
    currentCode: null,              // 현재 편집 중인 특보구역 코드 (WarnCode)
    mappings: {},                   // { code: { name, region, majorZones, smallZones } }
    selMajor: new Set(),            // 빠른 스타일링용 — 현재 선택된 대해구 번호
    selSmall: new Set(),            // 현재 선택된 소해구 ID ("123-5")
    warnZonesGeoJSON: null,         // /api/warn-zones 원본
    map: null,
    layers: {},                     // { warn, major, sub, selMajor, selSmall }
};

// ============================================================
// 지도 초기화
// ============================================================
function initMap() {
    // KHOA WMS (index2와 동일 엔드포인트)
    const khoaSource = new ol.source.TileWMS({
        url: '/api/ocean/khoa-wms',
        params: {
            'layer': 'BASEMAP_RLTM3857',
            'SERVICE': 'WMS', 'VERSION': '1.1.1', 'REQUEST': 'GetMap',
            'FORMAT': 'image/png', 'TRANSPARENT': true,
            'STYLES': '', 'LAYERS': '', 'SRS': 'EPSG:3857'
        },
        projection: 'EPSG:3857',
        crossOrigin: 'anonymous'
    });

    const baseLayer = new ol.layer.Tile({ source: khoaSource });

    // 대해구 레이어 (스타일은 함수로 — 선택 상태에 따라 다른 색)
    STATE.layers.major = new ol.layer.Vector({
        source: new ol.source.Vector(),
        style: majorStyle,
        zIndex: 50
    });

    // 소해구 레이어 (줌 8 초과에서만 표시)
    STATE.layers.sub = new ol.layer.Vector({
        source: new ol.source.Vector(),
        style: subStyle,
        minZoom: 8,
        zIndex: 49
    });

    // 특보구역 레이어
    STATE.layers.warn = new ol.layer.Vector({
        source: new ol.source.Vector(),
        style: warnStyle,
        zIndex: 60
    });

    STATE.map = new ol.Map({
        target: 'ol-map',
        layers: [baseLayer, STATE.layers.sub, STATE.layers.major, STATE.layers.warn],
        view: new ol.View({
            center: ol.proj.fromLonLat([128.5, 36.0]),
            zoom: 6,
            maxZoom: 14
        }),
        controls: ol.control.defaults.defaults({ attribution: false })
    });

    // 클릭 핸들러
    STATE.map.on('singleclick', onMapClick);

    // 줌 표시 갱신
    STATE.map.getView().on('change:resolution', () => {
        const z = STATE.map.getView().getZoom();
        document.getElementById('info-zoom').textContent = z.toFixed(1);
    });
    document.getElementById('info-zoom').textContent = STATE.map.getView().getZoom().toFixed(1);
}

// ============================================================
// 스타일 함수
// ============================================================
function majorStyle(feature) {
    const num = String(feature.get('marine_zone_no') || '');
    const isSel = STATE.selMajor.has(num);
    return new ol.style.Style({
        // 투명 fill = 클릭 hit 가능
        fill: new ol.style.Fill({ color: isSel ? 'rgba(255, 193, 7, 0.35)' : 'rgba(0,0,0,0)' }),
        stroke: new ol.style.Stroke({
            color: isSel ? '#ffc107' : 'rgba(255,255,255,0.35)',
            width: isSel ? 2 : 1
        })
    });
}

function subStyle(feature) {
    const parent = String(feature.get('parent_marine_zone_no') || '');
    const sub = feature.get('sub_no');
    const id = `${parent}-${sub}`;
    const isSel = STATE.selSmall.has(id);
    return new ol.style.Style({
        fill: new ol.style.Fill({ color: isSel ? 'rgba(79, 195, 247, 0.40)' : 'rgba(0,0,0,0)' }),
        stroke: new ol.style.Stroke({
            color: isSel ? '#4fc3f7' : 'rgba(255,255,255,0.18)',
            width: isSel ? 1.8 : 0.5
        })
    });
}

function warnStyle(feature) {
    const code = feature.get('WarnCode');
    const isCurrent = code === STATE.currentCode;
    return new ol.style.Style({
        fill: new ol.style.Fill({ color: 'rgba(0,0,0,0)' }),
        stroke: new ol.style.Stroke({
            color: isCurrent ? '#ff4081' : 'rgba(255, 64, 129, 0.55)',
            width: isCurrent ? 4 : 1.5,
            lineDash: isCurrent ? null : [6, 4]
        })
    });
}

// ============================================================
// 데이터 로드
// ============================================================
async function loadData() {
    // 1) 대해구 격자
    const r1 = await fetch('/marine_zone_area.json');
    const grid = await r1.json();
    const fmt = new ol.format.GeoJSON({
        dataProjection: 'EPSG:4326',
        featureProjection: 'EPSG:3857'
    });
    const majorFeats = fmt.readFeatures(grid);
    STATE.layers.major.getSource().addFeatures(majorFeats);

    // 2) 소해구 (3×3 분할 — ocean_map.js와 동일 로직, KMA 표준 sub_no 1~9)
    const subGeo = { type: 'FeatureCollection', features: [] };
    for (const f of grid.features) {
        const ring = (f.geometry && f.geometry.coordinates && f.geometry.coordinates[0])
            ? f.geometry.coordinates[0][0] : null;
        if (!ring || ring.length < 4) continue;
        let lonMin = Infinity, lonMax = -Infinity, latMin = Infinity, latMax = -Infinity;
        for (const p of ring) {
            if (p[0] < lonMin) lonMin = p[0];
            if (p[0] > lonMax) lonMax = p[0];
            if (p[1] < latMin) latMin = p[1];
            if (p[1] > latMax) latMax = p[1];
        }
        const lonStep = (lonMax - lonMin) / 3;
        const latStep = (latMax - latMin) / 3;
        const parentNo = (f.properties && f.properties.marine_zone_no) || '';
        for (let row = 0; row < 3; row++) {
            for (let col = 0; col < 3; col++) {
                const x0 = lonMin + col * lonStep;
                const x1 = x0 + lonStep;
                const y0 = latMin + row * latStep;
                const y1 = y0 + latStep;
                const subNo = (2 - row) * 3 + col + 1;
                subGeo.features.push({
                    type: 'Feature',
                    properties: { parent_marine_zone_no: parentNo, sub_no: subNo },
                    geometry: { type: 'Polygon', coordinates: [[[x0, y0], [x1, y0], [x1, y1], [x0, y1], [x0, y0]]] }
                });
            }
        }
    }
    STATE.layers.sub.getSource().addFeatures(fmt.readFeatures(subGeo));

    // 3) 특보구역 (44개)
    const r2 = await fetch('/api/warn-zones');
    STATE.warnZonesGeoJSON = await r2.json();
    const warnFeats = fmt.readFeatures(STATE.warnZonesGeoJSON);
    STATE.layers.warn.getSource().addFeatures(warnFeats);

    // 매핑 상태 초기화
    for (const f of STATE.warnZonesGeoJSON.features) {
        const code = f.properties.WarnCode;
        if (!code) continue;
        if (!STATE.mappings[code]) {
            STATE.mappings[code] = {
                name: f.properties.name || code,
                region: deriveRegion(f.properties.name || ''),
                majorZones: [],
                smallZones: []
            };
        }
    }

    document.getElementById('status').textContent =
        `대해구 ${majorFeats.length} · 특보구역 ${warnFeats.length} 로드 완료`;

    renderZoneList();
}

// 이름에서 region 추정 (그룹핑용 — 매핑 JSON에 region 없을 때 fallback)
function deriveRegion(name) {
    if (name.startsWith('서해중부')) return '서해중부';
    if (name.startsWith('서해남부')) return '서해남부';
    if (name.startsWith('남해서부')) return '남해서부';
    if (name.startsWith('남해동부')) return '남해동부';
    if (name.startsWith('동해남부')) return '동해남부';
    if (name.startsWith('동해중부')) return '동해중부';
    if (name.startsWith('동해북부')) return '동해북부';
    if (name.startsWith('제주')) return '제주';
    return '기타';
}

// ============================================================
// 좌측 목록 렌더
// ============================================================
function renderZoneList() {
    const listEl = document.getElementById('zone-list');
    listEl.innerHTML = '';

    const grouped = {};
    for (const [code, m] of Object.entries(STATE.mappings)) {
        const r = m.region || '기타';
        if (!grouped[r]) grouped[r] = [];
        grouped[r].push({ code, ...m });
    }

    // 지정 순서로 region 정렬
    const REGION_ORDER = ['서해중부', '서해남부', '남해서부', '남해동부', '동해남부', '동해중부', '동해북부', '제주', '기타'];
    const regionKeys = Object.keys(grouped).sort((a, b) => REGION_ORDER.indexOf(a) - REGION_ORDER.indexOf(b));

    for (const region of regionKeys) {
        const group = document.createElement('div');
        group.className = 'region-group';
        const title = document.createElement('div');
        title.className = 'region-title';
        title.textContent = region;
        group.appendChild(title);

        for (const z of grouped[region]) {
            const item = document.createElement('div');
            item.className = 'zone-item';
            const mCount = z.majorZones.length;
            const sCount = z.smallZones.length;
            if (mCount > 0 || sCount > 0) item.classList.add('done');
            if (z.code === STATE.currentCode) item.classList.add('active');

            const nameSpan = document.createElement('span');
            nameSpan.className = 'zone-name';
            nameSpan.textContent = z.name;
            item.appendChild(nameSpan);

            const counts = document.createElement('span');
            counts.className = 'zone-counts';
            counts.textContent = `대${mCount}/소${sCount}`;
            item.appendChild(counts);

            item.onclick = () => selectZone(z.code);
            group.appendChild(item);
        }
        listEl.appendChild(group);
    }
}

// ============================================================
// 특보구역 선택 + 화면 이동
// ============================================================
function selectZone(code) {
    STATE.currentCode = code;
    const m = STATE.mappings[code];
    document.getElementById('info-zone').textContent = m ? m.name : code;

    // 현재 선택된 대해구/소해구 set 갱신 (스타일 함수에서 참조)
    STATE.selMajor = new Set(m.majorZones.map(String));
    STATE.selSmall = new Set(m.smallZones.map(String));
    updateInfoPanel();
    renderZoneList();
    refreshLayers();

    // 폴리곤 화면 중앙으로 이동
    const feature = STATE.layers.warn.getSource().getFeatures()
        .find(f => f.get('WarnCode') === code);
    if (feature) {
        const ext = feature.getGeometry().getExtent();
        STATE.map.getView().fit(ext, { padding: [60, 60, 60, 60], duration: 400, maxZoom: 9 });
    }
}

function updateInfoPanel() {
    const m = STATE.mappings[STATE.currentCode];
    document.getElementById('info-major-count').textContent = m ? `${m.majorZones.length}개` : '0개';
    document.getElementById('info-small-count').textContent = m ? `${m.smallZones.length}개` : '0개';
    document.getElementById('info-mode').textContent = STATE.mode === 'major' ? '대해구' : '소해구';
}

function refreshLayers() {
    STATE.layers.major.changed();
    STATE.layers.sub.changed();
    STATE.layers.warn.changed();
}

// ============================================================
// 모드 토글
// ============================================================
function setMode(mode) {
    STATE.mode = mode;
    document.getElementById('mode-major').classList.toggle('active', mode === 'major');
    document.getElementById('mode-small').classList.toggle('active', mode === 'small');
    updateInfoPanel();
}

// ============================================================
// 클릭 처리
// ============================================================
function onMapClick(evt) {
    if (!STATE.currentCode) {
        showToast('먼저 좌측에서 특보구역을 선택하세요');
        return;
    }
    const m = STATE.mappings[STATE.currentCode];
    if (!m) return;

    const targetLayer = STATE.mode === 'major' ? STATE.layers.major : STATE.layers.sub;
    let hit = null;
    STATE.map.forEachFeatureAtPixel(evt.pixel, (feat, layer) => {
        if (layer === targetLayer) { hit = feat; return true; }
    }, { hitTolerance: 1 });

    if (!hit) return;

    if (STATE.mode === 'major') {
        const num = String(hit.get('marine_zone_no'));
        if (!num) return;
        const numInt = parseInt(num);
        const isOn = m.majorZones.includes(numInt);
        if (isOn) {
            m.majorZones = m.majorZones.filter(n => n !== numInt);
            m.smallZones = m.smallZones.filter(sid => sid.split('-')[0] !== num);
            STATE.selMajor.delete(num);
            for (let i = 1; i <= 9; i++) STATE.selSmall.delete(`${num}-${i}`);
        } else {
            m.majorZones.push(numInt);
            STATE.selMajor.add(num);
            for (let i = 1; i <= 9; i++) {
                const sid = `${num}-${i}`;
                if (!m.smallZones.includes(sid)) m.smallZones.push(sid);
                STATE.selSmall.add(sid);
            }
        }
    } else {
        const parent = String(hit.get('parent_marine_zone_no'));
        const sub = hit.get('sub_no');
        if (!parent || !sub) return;
        const sid = `${parent}-${sub}`;
        const isOn = m.smallZones.includes(sid);
        if (isOn) {
            m.smallZones = m.smallZones.filter(s => s !== sid);
            STATE.selSmall.delete(sid);
        } else {
            m.smallZones.push(sid);
            STATE.selSmall.add(sid);
        }
    }

    updateInfoPanel();
    renderZoneList();
    refreshLayers();
}

// ============================================================
// 업로드/다운로드
// ============================================================
function handleUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (e) => {
        try {
            const json = JSON.parse(e.target.result);
            let count = 0;
            for (const [code, m] of Object.entries(json)) {
                if (!m) continue;
                if (!STATE.mappings[code]) {
                    STATE.mappings[code] = {
                        name: m.name || code,
                        region: m.region || deriveRegion(m.name || ''),
                        majorZones: [],
                        smallZones: []
                    };
                }
                STATE.mappings[code].majorZones = Array.isArray(m.majorZones) ? m.majorZones.map(Number) : [];
                STATE.mappings[code].smallZones = Array.isArray(m.smallZones) ? m.smallZones.map(String) : [];
                if (m.name) STATE.mappings[code].name = m.name;
                if (m.region) STATE.mappings[code].region = m.region;
                count++;
            }
            // 현재 편집 중인 구역 set 갱신
            if (STATE.currentCode && STATE.mappings[STATE.currentCode]) {
                const m = STATE.mappings[STATE.currentCode];
                STATE.selMajor = new Set(m.majorZones.map(String));
                STATE.selSmall = new Set(m.smallZones.map(String));
            }
            renderZoneList();
            updateInfoPanel();
            refreshLayers();
            showToast(`업로드 완료: ${count}개 특보구역 매핑 반영됨`);
        } catch (err) {
            alert('JSON 파싱 실패: ' + err.message);
        }
        event.target.value = '';
    };
    reader.readAsText(file);
}

function handleDownload() {
    const out = {};
    for (const [code, m] of Object.entries(STATE.mappings)) {
        if (m.majorZones.length === 0 && m.smallZones.length === 0) continue;
        out[code] = {
            name: m.name,
            region: m.region,
            majorZones: [...m.majorZones].sort((a, b) => a - b),
            smallZones: [...m.smallZones].sort((a, b) => {
                const [aN, aI] = a.split('-').map(Number);
                const [bN, bI] = b.split('-').map(Number);
                return aN - bN || aI - bI;
            })
        };
    }
    const blob = new Blob([JSON.stringify(out, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'zone_grid_map.json';
    a.click();
    URL.revokeObjectURL(url);
    showToast(`다운로드: ${Object.keys(out).length}개 특보구역`);
}

function clearCurrent() {
    if (!STATE.currentCode) {
        showToast('선택된 특보구역이 없습니다');
        return;
    }
    const m = STATE.mappings[STATE.currentCode];
    if (!m) return;
    if (!confirm(`"${m.name}" 의 매핑을 모두 비우시겠습니까?`)) return;
    m.majorZones = [];
    m.smallZones = [];
    STATE.selMajor.clear();
    STATE.selSmall.clear();
    updateInfoPanel();
    renderZoneList();
    refreshLayers();
}

function showToast(text) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = text;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
}

// ============================================================
// 초기화
// ============================================================
(async function init() {
    initMap();
    try {
        await loadData();
    } catch (err) {
        document.getElementById('status').textContent = '⚠ 데이터 로드 실패: ' + err.message;
        console.error(err);
    }
})();
</script>
</body>
