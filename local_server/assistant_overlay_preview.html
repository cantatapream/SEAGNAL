<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>나리야 오버레이 — 최종 동작 미리보기 (A안)</title>
<style>
  :root { --bg:#04121f; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:radial-gradient(1200px 600px at 50% -10%, #0a2742 0%, var(--bg) 55%);
    color:#e6f1ff; font-family:-apple-system,BlinkMacSystemFont,Roboto,"Noto Sans KR",sans-serif; }
  .wrap { max-width:600px; margin:0 auto; padding:16px 14px 40px; }
  h1 { font-size:16px; margin:6px 0 2px; }
  p.sub { font-size:12.5px; color:#8da9c4; margin:0 0 12px; line-height:1.5; }
  .ctrl { background:#0b1f33; border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:12px; margin-bottom:14px; }
  .row { display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:8px; }
  .row .lab { font-size:11px; color:#8da9c4; width:62px; }
  button { padding:8px 12px; border-radius:9px; border:1px solid rgba(255,255,255,.12);
    background:rgba(255,255,255,.05); color:#e6f1ff; font-size:12.5px; font-weight:600; cursor:pointer; }
  button.on { background:#38bdf8; color:#04263b; border-color:#38bdf8; }
  .screen { position:relative; height:420px; border:1px solid rgba(255,255,255,.1); border-radius:18px;
    background:linear-gradient(180deg,#0a2236,#06182a); overflow:hidden; }
  .screen .hintmap { position:absolute; inset:0; display:grid; place-items:center; color:#28435c; font-size:13px; }

  /* ===== 실제 오버레이와 동일한 스타일 (assistant_overlay.js 와 1:1) ===== */
  #nariya-overlay{position:absolute;left:12px;right:12px;bottom:16px;z-index:99999;display:none;max-width:560px;margin:0 auto;
    color:#e6f1ff;background:rgba(9,24,40,.97);border:1px solid rgba(56,189,248,.40);border-radius:18px;
    box-shadow:0 14px 40px rgba(0,0,0,.55);padding:14px 16px;transition:padding .25s ease, max-width .25s ease;}
  #nariya-overlay .nv-head{display:flex;align-items:center;gap:12px;}
  #nariya-overlay .nv-st{font-size:13px;font-weight:700;}
  #nariya-overlay .nv-q{font-size:12.5px;color:#7fd2ff;margin-top:8px;}
  #nariya-overlay .nv-a{font-size:15px;line-height:1.55;margin-top:6px;color:#eaf4ff;}
  #nariya-overlay.nv-speaking{max-width:680px;padding:18px 20px;}
  #nariya-overlay.nv-speaking .nv-a{font-size:17.5px;line-height:1.65;margin-top:10px;max-height:300px;overflow-y:auto;}
  #nariya-overlay .nv-tap{font-size:11px;color:#6f8aa3;margin-top:10px;text-align:right;display:none;}
  #nariya-overlay.nv-speaking .nv-tap{display:block;}
  #nariya-overlay .orb{width:46px;height:46px;border-radius:50%;flex:0 0 auto;position:relative;
    background:conic-gradient(from 0deg,#4f8cff,#9b6bff,#ff6bcb,#ffd36b,#4f8cff);
    animation:nvSpin 4s linear infinite, nvBreathe 2.4s ease-in-out infinite;}
  #nariya-overlay .orb::after{content:"";position:absolute;inset:7px;border-radius:50%;background:rgba(9,24,40,.97);box-shadow:inset 0 0 12px rgba(0,0,0,.5);}
  #nariya-overlay .orb::before{content:"";position:absolute;inset:-5px;border-radius:50%;z-index:-1;background:inherit;filter:blur(12px);opacity:.55;}
  #nariya-overlay.nv-listening .orb{animation-duration:3.2s,1.5s;}
  #nariya-overlay.nv-thinking .orb{animation-duration:1.3s,2s;filter:hue-rotate(20deg);}
  #nariya-overlay.nv-speaking .orb{width:40px;height:40px;animation-duration:6s,1s;}
  @keyframes nvSpin{to{transform:rotate(360deg);}}
  @keyframes nvBreathe{0%,100%{transform:scale(.92);}50%{transform:scale(1.06);}}
</style>
</head>
<body>
<div class="wrap">
  <h1>🎙️ 나리야 오버레이 — 최종 동작 (A안: Gemini 그라데이션 오브)</h1>
  <p class="sub">대기 땐 아무것도 없고, <b>듣는중·생각중</b>엔 작게, <b>답변중</b>엔 넓게 펼쳐집니다.
  답변 길이에 따라 패널 크기가 <b>동적으로</b> 변합니다(짧은/긴 답변 버튼으로 확인).</p>

  <div class="ctrl">
    <div class="row"><span class="lab">상태</span>
      <button data-st="off" class="on">대기(숨김)</button>
      <button data-st="listening">듣는중</button>
      <button data-st="thinking">생각중</button>
      <button data-st="speaking">답변중</button>
    </div>
    <div class="row"><span class="lab">답변 길이</span>
      <button data-len="short" class="on">짧은 답변</button>
      <button data-len="long">긴 답변</button>
    </div>
    <div class="row"><span class="lab"></span>
      <button id="cycle" style="background:#1f6feb;border-color:#1f6feb;color:#fff;">▶ 전체 흐름 자동 재생</button>
    </div>
  </div>

  <div class="screen">
    <div class="hintmap">— 지도 화면(앱 배경) —</div>
    <div id="nariya-overlay">
      <div class="nv-head"><div class="orb"></div>
        <div style="flex:1;min-width:0;"><div class="nv-st">나리야</div><div class="nv-q"></div></div></div>
      <div class="nv-a"></div>
      <div class="nv-tap">화면을 누르면 닫혀요</div>
    </div>
  </div>
</div>

<script>
  var box = document.getElementById('nariya-overlay');
  var stEl = box.querySelector('.nv-st'), qEl = box.querySelector('.nv-q'), aEl = box.querySelector('.nv-a');
  var LABEL = { listening:'🎙️ 듣고 있어요', thinking:'💭 생각 중', speaking:'🔊 나리야' };
  var SHORT = '거문도는 지금 파고 0.5미터, 바람 초속 4미터로 잔잔합니다.';
  var LONG  = '거문도는 지금 파고 0.5미터로 잔잔하고, 바람은 북동풍 초속 4미터 정도입니다. '
    + '오전까지는 비슷하게 유지되겠지만 오후 들어 남서풍이 초속 8미터까지 강해지면서 파고도 1.5미터로 높아질 전망입니다. '
    + '조업은 오전에 마치고 복귀하시는 편이 안전하겠습니다. 현재 발효 중인 특보는 없습니다. 최종 판단은 선장님 몫입니다.';
  var curState = 'off', curLen = 'short';

  function render() {
    var s = curState;
    if (s === 'off') { box.style.display = 'none'; return; }
    box.className = 'nv-' + s;
    box.style.display = 'block';
    stEl.textContent = LABEL[s] || '나리야';
    qEl.textContent = (s === 'listening') ? '' : 'Q. 거문도 날씨 어때?';
    aEl.textContent = (s === 'speaking') ? (curLen === 'long' ? LONG : SHORT) : '';
  }
  function setBtns(attr, val) {
    document.querySelectorAll('button[' + attr + ']').forEach(function (b) { b.classList.toggle('on', b.getAttribute(attr) === val); });
  }
  document.querySelectorAll('button[data-st]').forEach(function (b) {
    b.addEventListener('click', function () { curState = b.dataset.st; setBtns('data-st', curState); render(); });
  });
  document.querySelectorAll('button[data-len]').forEach(function (b) {
    b.addEventListener('click', function () { curLen = b.dataset.len; setBtns('data-len', curLen); render(); });
  });
  box.addEventListener('click', function () { curState = 'off'; setBtns('data-st', 'off'); render(); });

  document.getElementById('cycle').addEventListener('click', function () {
    var seq = [['listening',1600],['thinking',1600],['speaking',5000],['off',300]], i = 0;
    function step() {
      if (i >= seq.length) return;
      curState = seq[i][0]; setBtns('data-st', curState); render();
      var d = seq[i][1]; i++; setTimeout(step, d);
    }
    step();
  });
  render();
</script>
</body>
</html>
