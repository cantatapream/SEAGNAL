# fly.toml app configuration file generated for seagnal-server on 2025-12-26T13:57:18+09:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'seagnal-server'
primary_region = 'nrt'

[build]

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024

# [데이터 영구 보존을 위한 볼륨 마운트]
[mounts]
  source = 'seagnal_data'
  destination = '/app/data'
