<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>해아름 특보구역 디지털화 도구 (개발자 전용)</title>

    <!-- OpenLayers 8.2.0 (INDEX2와 동일 버전) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@v8.2.0/ol.css">
    <script src="https://cdn.jsdelivr.net/npm/ol@v8.2.0/dist/ol.js"></script>

    <!-- 특보구역 카탈로그 (읽기 전용, 파일 수정 없음) -->
    <script src="/seaZoneCoordinates.js"></script>

    <style>
        * { box-sizing: border-box; }
        html, body {
            margin: 0; padding: 0;
            height: 100%; width: 100%;
            font-family: "Pretendard", "Noto Sans KR", sans-serif;
            overflow: hidden;
            background: #1a1a2e;
            color: #e0e0e0;
        }

        /* ---- 레이아웃 ---- */
        #root {
            display: flex;
            width: 100%;
            height: 100%;
        }

        #workspace {
            flex: 1;
            position: relative;
            overflow: hidden;
            background: #0a0a14;
        }

        #bg-image-wrap {
            position: absolute;
            inset: 0;
            overflow: hidden;
            z-index: 1;
            pointer-events: none; /* 기본은 통과. 정렬 모드에서만 auto로 토글됨 */
        }

        #bg-image {
            position: absolute;
            left: 0; top: 0;
            transform-origin: 0 0;
            user-select: none;
            -webkit-user-drag: none;
            max-width: none;
            max-height: none;
        }

        #map-container {
            position: absolute;
            inset: 0;
            z-index: 2;
            background: transparent;
        }

        /* OL 기본 타일 배경을 투명하게 — 배경 이미지가 비쳐 보이도록 */
        #map-container .ol-layer canvas {
            background: transparent;
        }

        /* ---- 컨트롤 패널 ---- */
        #control-panel {
            width: 340px;
            min-width: 340px;
            max-width: 340px;
            height: 100%;
            background: linear-gradient(180deg, #16213e, #1a1a2e);
            border-left: 1px solid rgba(255,255,255,0.08);
            padding: 16px;
            overflow-y: auto;
            font-size: 13px;
            color: #e0e0e0;
        }

        #control-panel h2 {
            font-size: 15px;
            margin: 0 0 4px 0;
            color: #fff;
        }
        #control-panel .subtitle {
            font-size: 11px;
            color: #888;
            margin-bottom: 14px;
        }

        .section {
            margin-bottom: 14px;
            padding: 10px;
            background: rgba(255,255,255,0.04);
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.06);
        }

        .section-title {
            font-size: 12px;
            color: #4fc3f7;
            font-weight: 600;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .section label {
            display: block;
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }

        /* 버튼 */
        .btn {
            display: inline-block;
            padding: 7px 12px;
            font-size: 12px;
            background: #2d3a5f;
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.15s;
            font-family: inherit;
        }
        .btn:hover { background: #3d4a6f; }
        .btn.primary { background: #1976d2; border-color: #1976d2; }
        .btn.primary:hover { background: #2186e2; }
        .btn.danger { background: #c62828; border-color: #c62828; }
        .btn.danger:hover { background: #d63838; }
        .btn.small { padding: 5px 9px; font-size: 11px; }
        .btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .btn-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
        .btn-row .btn { flex: 1; min-width: 0; }

        /* 모드 토글 */
        .mode-btn {
            display: block;
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 4px;
            font-size: 12px;
            background: #1e2a4a;
            color: #bbb;
            border: 1px solid transparent;
            border-radius: 6px;
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: all 0.15s;
        }
        .mode-btn:hover { background: #2a3658; }
        .mode-btn.active {
            background: #1976d2;
            color: white;
            border-color: #4fc3f7;
            box-shadow: 0 0 0 2px rgba(79,195,247,0.2);
        }
        .mode-btn .shortcut {
            float: right;
            color: #888;
            font-size: 10px;
        }
        .mode-btn.active .shortcut { color: rgba(255,255,255,0.7); }

        /* 슬라이더 */
        input[type="range"] {
            width: 100%;
            margin: 4px 0;
        }
        .slider-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }
        .slider-row label { flex: 0 0 60px; margin: 0; font-size: 11px; }
        .slider-row input[type="range"] { flex: 1; }
        .slider-row .val { flex: 0 0 36px; font-size: 11px; text-align: right; color: #4fc3f7; }

        /* 드롭다운 */
        select {
            width: 100%;
            padding: 7px;
            background: #1e2a4a;
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px;
            font-size: 12px;
            font-family: inherit;
        }

        /* 파일 업로드 */
        input[type="file"] {
            display: none;
        }
        .file-label {
            display: inline-block;
            padding: 7px 12px;
            font-size: 12px;
            background: #2d3a5f;
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            text-align: center;
        }
        .file-label:hover { background: #3d4a6f; }

        /* 상태 정보 */
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: #aaa;
            padding: 3px 0;
        }
        .info-row .label { color: #888; }
        .info-row .value { color: #4fc3f7; font-weight: 600; }

        /* JSON 미리보기 */
        #json-preview {
            width: 100%;
            height: 140px;
            background: #0a0a14;
            color: #64b5f6;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 8px;
            font-family: "Consolas", "Menlo", monospace;
            font-size: 10px;
            resize: vertical;
        }

        /* 진행 바 */
        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255,255,255,0.08);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 4px;
        }
        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #4fc3f7, #1976d2);
            transition: width 0.2s;
        }

        /* 좌표 표시 (커서 위치) */
        #cursor-coord {
            position: absolute;
            bottom: 10px;
            left: 10px;
            background: rgba(0,0,0,0.7);
            color: #4fc3f7;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: monospace;
            pointer-events: none;
            z-index: 5;
        }

        /* 모드 도움말 오버레이 */
        #mode-hint {
            position: absolute;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(25, 118, 210, 0.9);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            pointer-events: none;
            z-index: 5;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        /* 토스트 */
        #toast {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.25s;
            pointer-events: none;
        }
        #toast.show { opacity: 1; }

        /* 드롭다운 커스텀: 지역별 그룹 박스 */
        #zone-list {
            max-height: 260px;
            overflow-y: auto;
            background: #0f1629;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 6px;
            padding: 6px;
            margin-top: 4px;
        }
        #zone-list .region-group {
            margin-bottom: 6px;
        }
        #zone-list .region-name {
            font-size: 10px;
            color: #888;
            padding: 2px 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            margin-bottom: 2px;
        }
        #zone-list .zone-item {
            display: flex;
            align-items: center;
            padding: 5px 6px;
            font-size: 12px;
            cursor: pointer;
            border-radius: 4px;
            color: #bbb;
        }
        #zone-list .zone-item:hover { background: rgba(79,195,247,0.1); }
        #zone-list .zone-item.active {
            background: #1976d2;
            color: white;
        }
        #zone-list .zone-icon {
            width: 16px;
            display: inline-block;
            text-align: center;
            margin-right: 6px;
            font-size: 11px;
        }
        #zone-list .zone-item.status-done .zone-icon { color: #81c784; }
        #zone-list .zone-item.status-progress .zone-icon { color: #ffb74d; }
        #zone-list .zone-item.status-empty .zone-icon { color: #555; }

        /* 줌 힌트 */
        .zone-item .zone-label { flex: 1; }
        .zone-hint, .zone-item .zone-hint { }
        .section .zoom-hint {
            font-size: 10px;
            color: #777;
            margin: 3px 0 6px 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="root">
        <!-- ============ 작업 영역 ============ -->
        <div id="workspace">
            <div id="bg-image-wrap">
                <img id="bg-image" alt="배경 참조 이미지" />
            </div>
            <div id="map-container"></div>
            <div id="mode-hint">🖱 클릭으로 점 찍기</div>
            <div id="cursor-coord">lon: ---, lat: ---</div>
            <div id="toast"></div>
        </div>

        <!-- ============ 컨트롤 패널 ============ -->
        <aside id="control-panel">
            <h2>해아름 특보구역 디지털화</h2>
            <div class="subtitle">개발자 전용 툴 · 기존 파일 무수정</div>

            <!-- ── 배경 이미지 ── -->
            <div class="section">
                <div class="section-title">배경 이미지</div>
                <label for="bg-upload" class="file-label">📷 스크린샷 업로드</label>
                <input type="file" id="bg-upload" accept="image/*" />
                <div class="btn-row" style="margin-top: 6px;">
                    <button class="btn small" id="btn-bg-reset">위치 리셋</button>
                    <button class="btn small danger" id="btn-bg-clear">제거</button>
                </div>
            </div>

            <!-- ── 불투명도 ── -->
            <div class="section">
                <div class="section-title">불투명도</div>
                <div class="slider-row">
                    <label>해아름</label>
                    <input type="range" id="opacity-map" min="0" max="100" value="55" />
                    <span class="val" id="opacity-map-val">55%</span>
                </div>
                <div class="slider-row">
                    <label>배경</label>
                    <input type="range" id="opacity-bg" min="0" max="100" value="100" />
                    <span class="val" id="opacity-bg-val">100%</span>
                </div>
            </div>

            <!-- ── 해아름 지도 미세 줌 (1% 단위) ── -->
            <div class="section">
                <div class="section-title">해아름 지도 줌 (1% 단위)</div>
                <div class="info-row">
                    <span class="label">현재 줌</span>
                    <span class="value" id="zoom-val">7.00</span>
                </div>
                <input type="range" id="zoom-slider" min="4" max="20" step="0.01435" value="7" />
                <div class="zoom-hint">휠 1틱 = 1% · Shift+휠 = 5% · 드래그로 팬</div>
                <div class="btn-row">
                    <button class="btn small" id="btn-zoom-m10" title="-10%">−10%</button>
                    <button class="btn small" id="btn-zoom-m1" title="-1%">−1%</button>
                    <button class="btn small" id="btn-zoom-p1" title="+1%">+1%</button>
                    <button class="btn small" id="btn-zoom-p10" title="+10%">+10%</button>
                </div>
                <div class="btn-row">
                    <button class="btn small" id="btn-zoom-reset">줌 리셋 (7)</button>
                </div>
            </div>

            <!-- ── 모드 ── -->
            <div class="section">
                <div class="section-title">모드</div>
                <button class="mode-btn" data-mode="align">🎯 정렬 (배경 이동/확대)<span class="shortcut">A</span></button>
                <button class="mode-btn active" data-mode="draw">✏️ 점 찍기<span class="shortcut">D</span></button>
                <button class="mode-btn" data-mode="edit">🔧 편집 (드래그/삭제)<span class="shortcut">E</span></button>
                <button class="mode-btn" data-mode="center">⭐ 중앙점<span class="shortcut">C</span></button>
            </div>

            <!-- ── 구역 선택 ── -->
            <div class="section">
                <div class="section-title">특보구역 선택</div>
                <div id="zone-list"><!-- 동적 생성 --></div>
            </div>

            <!-- ── 현재 구역 ── -->
            <div class="section">
                <div class="section-title">현재 구역</div>
                <div class="info-row"><span class="label">이름</span><span class="value" id="cur-name">-</span></div>
                <div class="info-row"><span class="label">코드</span><span class="value" id="cur-code">-</span></div>
                <div class="info-row"><span class="label">지역</span><span class="value" id="cur-region">-</span></div>
                <div class="info-row"><span class="label">점 개수</span><span class="value" id="cur-points">0</span></div>
                <div class="info-row"><span class="label">중앙점</span><span class="value" id="cur-center">없음</span></div>
                <div class="info-row"><span class="label">닫힘</span><span class="value" id="cur-closed">-</span></div>
                <div class="btn-row">
                    <button class="btn small" id="btn-close-poly">폴리곤 닫기</button>
                    <button class="btn small" id="btn-open-poly">열기</button>
                </div>
                <div class="btn-row">
                    <button class="btn small" id="btn-undo">↶ Undo</button>
                    <button class="btn small" id="btn-redo">↷ Redo</button>
                </div>
                <div class="btn-row">
                    <button class="btn small danger" id="btn-clear-zone">이 구역 점 전체 삭제</button>
                </div>
            </div>

            <!-- ── 진행률 ── -->
            <div class="section">
                <div class="section-title">작업 진도</div>
                <div class="info-row">
                    <span class="label">완료</span>
                    <span class="value" id="progress-text">0 / 0</span>
                </div>
                <div class="progress-bar"><div class="progress-bar-fill" id="progress-fill" style="width:0%"></div></div>
            </div>

            <!-- ── 내보내기 ── -->
            <div class="section">
                <div class="section-title">내보내기</div>
                <div class="btn-row">
                    <button class="btn primary" id="btn-preview">미리보기</button>
                    <button class="btn primary" id="btn-download">JSON 다운로드</button>
                </div>
                <div class="btn-row">
                    <button class="btn small" id="btn-copy">텍스트 복사</button>
                    <button class="btn small danger" id="btn-reset-all">전체 초기화</button>
                </div>
                <textarea id="json-preview" readonly placeholder="[미리보기 / 복사] 버튼을 누르면 여기에 JSON이 출력됩니다."></textarea>
            </div>
        </aside>
    </div>

    <script src="/js/draw_haearum_zones.js"></script>
</body>
</html>
