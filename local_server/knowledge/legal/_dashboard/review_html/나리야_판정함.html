<title>나리야 판정함</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
  --ground:#f3f5f4; --surface:#ffffff; --ink:#17232e; --muted:#58676f; --rule:#d7dedb;
  --accent:#1d6b72; --accent-ink:#ffffff; --accent-soft:#e0eeed;
  --warn:#9a620f; --warn-soft:#f7ecd9; --bad:#a23b33; --bad-soft:#f6e3e1; --good:#2d7547; --good-soft:#e2f0e6;
  --serif:"Noto Serif KR","Nanum Myeongjo",Georgia,serif;
  --sans:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ground:#0f1519; --surface:#172027; --ink:#dde6e9; --muted:#95a5ac; --rule:#2b373e;
  --accent:#62b8c0; --accent-ink:#0c1a1d; --accent-soft:#193033;
  --warn:#dca650; --warn-soft:#33291a; --bad:#e3827a; --bad-soft:#3a2321; --good:#72c493; --good-soft:#1c3024;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0f1519; --surface:#172027; --ink:#dde6e9; --muted:#95a5ac; --rule:#2b373e;
  --accent:#62b8c0; --accent-ink:#0c1a1d; --accent-soft:#193033;
  --warn:#dca650; --warn-soft:#33291a; --bad:#e3827a; --bad-soft:#3a2321; --good:#72c493; --good-soft:#1c3024;
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;margin:0;padding-inline:16px;padding-block:28px 96px}
.wrap{max-width:980px;margin:0 auto;display:grid;gap:28px}
h1,h2,h3{font-family:var(--serif);text-wrap:balance;margin:0;line-height:1.3}
h1{font-size:30px}
h2{font-size:21px}
h3{font-size:16px;font-family:var(--sans);font-weight:600}
p{margin:0}
.lede{color:var(--muted);max-width:68ch}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--muted)}
header{display:grid;gap:10px}
.save{font-size:13px;display:inline-flex;gap:8px;align-items:center;padding:4px 10px;border:1px solid var(--rule);border-radius:999px;width:fit-content;background:var(--surface)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.save[data-s="db"] .dot{background:var(--good)} .save[data-s="local"] .dot{background:var(--warn)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--ground);padding-block:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;border-bottom:1px solid var(--rule)}
.tab{font:inherit;text-align:left;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;display:grid;gap:4px}
.tab:hover{border-color:var(--accent)}
.tab[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab b{font-size:14px}
.bar{height:5px;border-radius:3px;background:var(--rule);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.tab small{font-family:var(--mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
section.panel{display:grid;gap:16px}
.intro{display:grid;gap:8px;max-width:72ch}
.intro .how{font-size:14px;background:var(--accent-soft);border-radius:10px;padding:10px 14px}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pill{font:inherit;font-size:13px;cursor:pointer;background:var(--surface);color:var(--ink);border:1px solid var(--rule);border-radius:999px;padding:5px 12px}
.pill[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.list{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:14px 16px;display:grid;gap:10px}
.card[data-done="1"]{border-color:color-mix(in srgb,var(--accent) 45%,var(--rule))}
.card .top{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.num{font-family:var(--mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.q{font-weight:600}
.meta{font-size:13px;color:var(--muted)}
.opts{display:grid;gap:8px}
.opt{font:inherit;cursor:pointer;text-align:left;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:10px;padding:8px 12px;display:grid;gap:2px}
.opt:hover{border-color:var(--accent)}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt .quote{font-size:14px}
.opt .src{font-family:var(--mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.row{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-size:13px;cursor:pointer;background:transparent;color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:6px 10px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip.neg[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.tag{font-size:12px;border-radius:6px;padding:1px 7px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)}
.words{display:flex;flex-wrap:wrap;gap:6px}
.words span{font-size:12.5px;border:1px dashed var(--rule);border-radius:6px;padding:1px 7px;color:var(--muted)}
.pct{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:500}
textarea{font:inherit;font-size:14px;width:100%;min-height:38px;resize:vertical;border:1px solid var(--rule);border-radius:8px;padding:6px 10px;background:var(--ground);color:var(--ink)}
details{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:10px 14px}
details summary{cursor:pointer;font-weight:600}
details ul{margin:8px 0 0;padding-left:18px;display:grid;gap:4px;font-size:13.5px}
.more{justify-self:start}
.footer{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.footer .in{max-width:980px;margin:0 auto;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.btn{font:inherit;font-weight:600;cursor:pointer;background:var(--accent);color:var(--accent-ink);border:0;border-radius:10px;padding:9px 16px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
#out{width:100%;min-height:120px;font-family:var(--mono);font-size:12px}
.old{display:grid;gap:10px}
.old .card{grid-template-columns:1fr auto;align-items:start}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
@media (max-width:560px){h1{font-size:25px}.old .card{grid-template-columns:1fr}nav.tabs{grid-template-columns:none;grid-auto-flow:column;grid-auto-columns:minmax(128px,1fr);overflow-x:auto;padding-block:8px}.tab{padding:7px 10px;gap:3px}.tab b{font-size:13px}}
</style>

<div class="wrap">
  <header>
    <h1>나리야 판정함</h1>
    <p class="lede">기계가 할 수 있는 일은 끝냈고, 여기 남은 것은 <b>사람이 골라야 하는 것</b>만 모았습니다. 기계가 고르면 틀릴 때 아무도 모르기 때문입니다. 누르는 즉시 저장되고, 저는 저장된 판정을 읽어 저장소에 반영합니다. 한 번에 다 하실 필요는 없습니다.</p>
    <div class="save" id="save" data-s="none"><span class="dot"></span><span id="saveText">저장 연결 확인 중…</span></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="판정 구역"></nav>

  <main id="main"></main>
</div>

<div class="footer">
  <div class="in">
    <span class="muted" id="total"></span>
    <div class="row">
      <button class="btn ghost" id="showOut" type="button">결과를 글로 보기</button>
    </div>
  </div>
</div>

const el = (tag, attrs={}, ...kids) => { const e=document.createElement(tag); for (const [k,v] of Object.entries(attrs)) { if (k==='text') e.textContent=v; else if (k.startsWith('on')) e.addEventListener(k.slice(2), v); else if (v!==false && v!=null) e.setAttribute(k, v===true?'':v); } for (const k of kids) if (k!=null) e.append(k); return e; };
const pct = x => Math.round(x*100) + '%';

let state = {};
try { state = JSON.parse(localStorage.getItem('nrya-judge') || '{}') || {}; } catch (_) { state = {}; }
let db = null;
const saveLocal = () => { try { localStorage.setItem('nrya-judge', JSON.stringify(state)); } catch (_) {} };

const SECTIONS = [
  {id:"ev", name:"정답 문장 표식", items: DATA.evi, key: x => "ev-"+x.n},
  {id:"sm", name:"요약 의심 쪽", items: DATA.sumr, key: (x,i) => "sm-"+i},
  {id:"rw", name:"원문 후보 확인", items: DATA.r69, key: (x,i) => "rw-"+i},
  {id:"op", name:"운영에서 확인", items: [{n:15,q:"인천항 관제구역 정확한 경계 좌표가 어디인가요?",a:"선박교통관제에 관한 규정(고시) 별표1 — 인천항 좌표 01. 북위 37도 05분 00초 …"},{n:19,q:"어촌·어항 계획도 대상(별표1 25호)?",a:"해양환경보전및활용에관한법률 시행령 별표1 25호 — 「어촌·어항법」 제4조에 따른 어촌·어항발전기본계획"}], key: x => "op-"+x.n},
  {id:"old", name:"예전부터 남은 것", items: OLD, key: x => "old-"+x.id}
];
let cur = 'ev';
try { cur = localStorage.getItem('nrya-tab') || 'ev'; } catch (_) {}
if (location.hash && SECTIONS.some(s => s.id === location.hash.slice(1))) cur = location.hash.slice(1);

function done(sec){ return sec.items.filter((x,i)=> state[sec.key(x,i)] && state[sec.key(x,i)].v).length; }

function setJ(key, v, extra={}) {
  const prev = state[key] || {};
  const next = {...prev, ...extra, v, at: new Date().toISOString()};
  if (prev.v === v && !('note' in extra)) { delete next.v; }
  state[key] = next; saveLocal(); render();
  if (db) db.doc('judgments/' + key).set({...next, key}).catch(() => setSave('local'));
}

function setSave(s){ const b=$('#save'); b.dataset.s=s; $('#saveText').textContent = s==='db' ? '저장됨 — 판정이 바로 제게 전달됩니다' : s==='local' ? '이 브라우저에만 저장 중 — 끝나면 「결과를 글로 보기」를 복사해 채팅에 붙여 주세요' : '저장 연결 확인 중…'; }

function renderTabs(){
  const nav=$('#tabs'); nav.replaceChildren();
  for (const s of SECTIONS) {
    const d=done(s), n=s.items.length;
    nav.append(el('button',{class:'tab',type:'button','aria-current':String(s.id===cur),onclick:()=>{cur=s.id;try{localStorage.setItem('nrya-tab',cur)}catch(_){};render();window.scrollTo({top:0})}},
      el('b',{text:s.name}), el('div',{class:'bar'}, el('i',{style:`width:${n?Math.round(100*d/n):0}%`})), el('small',{text:`${d} / ${n}`})));
  }
  const all=SECTIONS.reduce((a,s)=>a+done(s),0), tot=SECTIONS.reduce((a,s)=>a+s.items.length,0);
  $('#total').textContent = `판정한 것 ${all} / ${tot}`;
}

let evFilter='left', evShown=25;
function evPanel(){
  const sec=SECTIONS[0];
  const p=el('section',{class:'panel'});
  p.append(el('div',{class:'intro'},
    el('h2',{text:'정답 문장 표식 — 골든 '+DATA.evi.length+'문항'}),
    el('p',{text:'검색을 고칠 때 「정답이 근거자료에 실렸나」를 기계가 재려면, 문항마다 정답이 담긴 짧은 원문 조각이 하나 있어야 합니다. 지금은 291문항 중 한 문항도 없어서, 검색을 바꾸면 좋아졌는지 나빠졌는지 잴 수 없습니다(3-72 를 멈춘 까닭).'}),
    el('p',{class:'how',text:'문항을 읽고, 아래 후보 중 「이 조각이 근거자료에 있으면 답할 수 있다」 싶은 것 하나를 누르세요. 후보는 정답 조문의 원문과 위키에 글자 그대로 함께 있는 조각입니다. 맞는 것이 없으면 「맞는 조각이 없다」를 누르세요.'})));
  const tools=el('div',{class:'tools'},
    el('button',{class:'pill',type:'button','aria-pressed':String(evFilter==='left'),onclick:()=>{evFilter='left';evShown=25;render()},text:'남은 것만'}),
    el('button',{class:'pill',type:'button','aria-pressed':String(evFilter==='all'),onclick:()=>{evFilter='all';evShown=25;render()},text:'전체'}),
    el('button',{class:'pill',type:'button','aria-pressed':String(evFilter==='weak'),onclick:()=>{evFilter='weak';evShown=25;render()},text:'질문 낱말이 안 든 초안 ('+DATA.evi.filter(x=>!x.맞춤).length+')'}));
  p.append(tools);
  let items=DATA.evi.map(x=>({x,k:sec.key(x)}));
  if (evFilter==='left') items=items.filter(o=>!(state[o.k]&&state[o.k].v));
  if (evFilter==='weak') items=items.filter(o=>!o.x.맞춤);
  const list=el('div',{class:'list'});
  for (const {x,k} of items.slice(0,evShown)) {
    const v=state[k]&&state[k].v;
    const c=el('article',{class:'card','data-done':v?'1':'0'});
    c.append(el('div',{class:'top'}, el('span',{class:'num',text:'#'+x.n}), el('span',{class:'q',text:x.q})));
    c.append(el('p',{class:'meta',text:'정답: '+x.법+' '+x.조}));
    const opts=el('div',{class:'opts'});
    x.c.forEach((cand,i)=>{
      const tag = cand.흔함>1 ? el('span',{class:'tag',text:cand.흔함+'쪽에 나옴'}) : null;
      opts.append(el('button',{class:'opt',type:'button','aria-pressed':String(v==='c'+i),onclick:()=>setJ(k,'c'+i,{표식:cand.표식,쪽:cand.쪽})},
        el('span',{class:'quote'}, '«'+cand.표식+'» ', tag), el('span',{class:'src',text:cand.쪽})));
    });
    c.append(opts);
    c.append(el('div',{class:'row'},
      el('button',{class:'chip neg',type:'button','aria-pressed':String(v==='none'),onclick:()=>setJ(k,'none'),text:'맞는 조각이 없다'}),
      el('button',{class:'chip',type:'button','aria-pressed':String(v==='skip'),onclick:()=>setJ(k,'skip'),text:'이 문항은 건너뛴다'})));
    list.append(c);
  }
  p.append(list);
  if (items.length>evShown) p.append(el('button',{class:'pill more',type:'button',onclick:()=>{evShown+=25;render()},text:`25개 더 보기 (남은 ${items.length-evShown})`}));
  if (!items.length) p.append(el('p',{class:'muted',text:'이 보기에는 남은 문항이 없습니다.'}));
  p.append(el('details',{}, el('summary',{text:'초안을 못 만든 '+DATA.evfail.length+'문항 (할 일 없음 · 까닭만)'}),
    el('ul',{}, ...DATA.evfail.map(f=>el('li',{text:`#${f.n} ${f.q} — ${f.까닭}`})))));
  return p;
}

const SM_OPTS=[['a','요약·누락이다 — 원문대로 다시 옮겨라'],['b','표로 옮기며 생긴 차이다 — 그대로 둔다'],['c','원문이 더 새 판이다 — 위키를 새 판에 맞춰라'],['d','모르겠다 — 원문을 같이 보자']];
function smPanel(){
  const sec=SECTIONS[1];
  const p=el('section',{class:'panel'});
  p.append(el('div',{class:'intro'},
    el('h2',{text:'요약 의심 쪽 — '+DATA.sumr.length+'쪽'}),
    el('p',{text:'「원문 그대로 · 요약 금지」를 선언했는데, 원문의 낱말이 95% 넘게 남아 있지 않은 쪽입니다. 원문 낱말이 몇 % 남았는지와, 원문에만 있고 위키에는 없는 낱말을 보여 드립니다.'}),
    el('p',{class:'how',text:'낱말을 보고 어떤 차이인지 고르세요. 「요약·누락」이면 제가 원문대로 다시 옮기고, 「표로 옮긴 차이」면 그대로 둡니다. 판정한 쪽은 게이트(V5-55)의 기준에서 따로 셉니다.'})));
  const list=el('div',{class:'list'});
  DATA.sumr.forEach((x,i)=>{
    const k=sec.key(x,i), v=state[k]&&state[k].v;
    const c=el('article',{class:'card','data-done':v?'1':'0'});
    const t=x.덮임<0.6?'bad':x.덮임<0.9?'':'ok';
    c.append(el('div',{class:'top'}, el('span',{class:'tag '+t}, '원문 낱말 ', el('span',{class:'pct',text:pct(x.덮임)}), ' 남음'), el('span',{class:'q',text:x.쪽.replace(/\.md$/,'')})));
    c.append(el('p',{class:'mono muted',text:'원문: '+x.원문}));
    if (x.잃은&&x.잃은.length) c.append(el('div',{}, el('p',{class:'meta',text:'원문에만 있는 낱말'}), el('div',{class:'words'}, ...x.잃은.map(w=>el('span',{text:w})))));
    c.append(el('div',{class:'row'}, ...SM_OPTS.map(([o,l])=>el('button',{class:'chip'+(o==='a'?' neg':''),type:'button','aria-pressed':String(v===o),onclick:()=>setJ(k,o,{쪽:x.쪽}),text:l}))));
    list.append(c);
  });
  p.append(list);
  return p;
}

function rwPanel(){
  const sec=SECTIONS[2];
  const p=el('section',{class:'panel'});
  p.append(el('div',{class:'intro'},
    el('h2',{text:'원문 후보 확인 — '+DATA.r69.length+'쪽'}),
    el('p',{text:'「원문 그대로」를 선언했지만 어느 원문 파일인지 적혀 있지 않던 156쪽 중, 제가 증명할 수 있는 54쪽은 이미 원문 경로를 적었습니다(원문 낱말 95% 넘게 남은 후보가 하나뿐일 때만). 여기 남은 것은 후보는 있는데 증명이 안 된 쪽입니다.'}),
    el('p',{class:'how',text:'후보 파일이 이 쪽의 원문이 맞는지 고르세요. 맞다고 하시면 경로를 적고, 낱말이 덜 남은 만큼은 「요약 의심」으로 다시 올려 드립니다.'})));
  const list=el('div',{class:'list'});
  DATA.r69.forEach((x,i)=>{
    const k=sec.key(x,i), v=state[k]&&state[k].v;
    const c=el('article',{class:'card','data-done':v?'1':'0'});
    c.append(el('div',{class:'top'}, el('span',{class:'q',text:x.쪽.replace(/\.md$/,'')})));
    c.append(el('p',{class:'meta',text:x.까닭}));
    const opts=el('div',{class:'opts'});
    x.후보.forEach((cand,j)=>{
      opts.append(el('button',{class:'opt',type:'button','aria-pressed':String(v==='c'+j),onclick:()=>setJ(k,'c'+j,{쪽:x.쪽,경로:cand.경로})},
        el('span',{class:'quote'}, '이 파일이 원문이다 · 원문 낱말 ', el('span',{class:'pct',text:pct(cand.덮임)}), ' 남음 ', el('span',{class:'tag'+(cand.출처==='쪽에 적힘'?' ok':''),text:cand.출처})),
        el('span',{class:'src',text:cand.경로})));
    });
    c.append(opts);
    c.append(el('div',{class:'row'},
      el('button',{class:'chip',type:'button','aria-pressed':String(v==='all'),onclick:()=>setJ(k,'all',{쪽:x.쪽,경로들:x.후보.map(c=>c.경로)}),text:'모두 이 쪽의 원문이다 (별표 여럿)'}),
      el('button',{class:'chip neg',type:'button','aria-pressed':String(v==='none'),onclick:()=>setJ(k,'none',{쪽:x.쪽}),text:'원문이 아니다'}),
      el('button',{class:'chip',type:'button','aria-pressed':String(v==='skip'),onclick:()=>setJ(k,'skip',{쪽:x.쪽}),text:'모르겠다'})));
    list.append(c);
  });
  p.append(list);
  p.append(el('details',{}, el('summary',{text:'후보조차 없는 '+DATA.r69none.length+'쪽 (할 일 없음 · 원문 파일이 우리에게 없거나 쪽 이름으로 찾을 수 없다)'}),
    el('ul',{}, ...DATA.r69none.map(f=>el('li',{text:f.쪽.replace(/\.md$/,'')})))));
  return p;
}

const OP_OPTS=[['ok','정답을 답했다'],['unk','「확인되지 않습니다」라고 했다'],['wrong','다른(틀린) 답을 했다']];
function opPanel(){
  const sec=SECTIONS[3];
  const p=el('section',{class:'panel'});
  p.append(el('div',{class:'intro'},
    el('h2',{text:'운영 챗봇에서 확인 — 2문항'}),
    el('p',{text:'어느 AI 로도 「확인되지 않습니다」였던 두 문항입니다. 원인은 검색이 큰 표를 앞에서부터 잘라 싣던 것이었고, 병합된 main 에서 고쳤습니다. 이 개발 환경에는 Gemini 키가 없어서 운영의 검색어 확장 단계는 재현하지 못했습니다. 그래서 운영에서 한 번 물어봐 주셔야 합니다.'}),
    el('p',{class:'how',text:'새 코드가 배포된 뒤, 운영 챗봇에 아래 질문을 그대로 넣고 답을 고르세요. 「확인되지 않습니다」가 또 나오면 메모에 답 첫 줄을 적어 주세요.'})));
  const list=el('div',{class:'list'});
  sec.items.forEach(x=>{
    const k=sec.key(x), v=state[k]&&state[k].v;
    const c=el('article',{class:'card','data-done':v?'1':'0'});
    const copy=el('button',{class:'chip',type:'button',text:'질문 복사',onclick:async(e)=>{try{await navigator.clipboard.writeText(x.q);e.target.textContent='복사됨'}catch(_){const r=document.createRange();r.selectNodeContents(qEl);const s=getSelection();s.removeAllRanges();s.addRange(r);e.target.textContent='선택됨 — 복사하세요'}}});
    const qEl=el('span',{class:'q',text:x.q});
    c.append(el('div',{class:'top'}, el('span',{class:'num',text:'골든 '+x.n}), qEl, copy));
    c.append(el('p',{class:'meta',text:'정답: '+x.a}));
    c.append(el('div',{class:'row'}, ...OP_OPTS.map(([o,l])=>el('button',{class:'chip'+(o!=='ok'?' neg':''),type:'button','aria-pressed':String(v===o),onclick:()=>setJ(k,o),text:l}))));
    const ta=el('textarea',{id:'note-'+k,placeholder:'메모 (선택)',rows:'1'}); ta.value=(state[k]&&state[k].note)||'';
    ta.addEventListener('change',()=>setJ(k,(state[k]&&state[k].v)||'memo',{note:ta.value}));
    c.append(ta);
    list.append(c);
  });
  p.append(list);
  return p;
}

function oldPanel(){
  const sec=SECTIONS[4];
  const p=el('section',{class:'panel'});
  p.append(el('div',{class:'intro'},
    el('h2',{text:'예전부터 남은 사람 몫 — '+OLD.length+'가지'}),
    el('p',{text:'오늘 새로 생긴 것은 아니지만 여전히 사장님 판단이 필요한 것들입니다. 대부분 이미 드린 검토장이 있습니다. 여기서는 목록만 보여 드리고, 손대셨으면 「끝냈다」를 눌러 주세요.'})));
  const list=el('div',{class:'old'});
  OLD.forEach(x=>{
    const k=sec.key(x), v=state[k]&&state[k].v;
    list.append(el('article',{class:'card','data-done':v?'1':'0'},
      el('div',{style:'display:grid;gap:4px'}, el('div',{class:'top'}, el('h3',{text:x.t}), el('span',{class:'tag',text:x.s})), el('p',{class:'meta',text:x.d})),
      el('button',{class:'chip',type:'button','aria-pressed':String(v==='done'),onclick:()=>setJ(k,'done'),text:v==='done'?'끝냈다 ✓':'끝냈다'})));
  });
  p.append(list);
  return p;
}

function render(){
  renderTabs();
  const m=$('#main'); m.replaceChildren();
  m.append({ev:evPanel,sm:smPanel,rw:rwPanel,op:opPanel,old:oldPanel}[cur]());
}

function textOut(){
  const lines=['[나리야 판정함 결과]'];
  for (const s of SECTIONS) {
    const got=s.items.map((x,i)=>[s.key(x,i),state[s.key(x,i)]]).filter(([,j])=>j&&j.v);
    if (!got.length) continue;
    lines.push('', '## '+s.name+' ('+got.length+')');
    for (const [k,j] of got) lines.push(k+' = '+j.v+(j.표식?' «'+j.표식+'» '+j.쪽:'')+(j.경로?' '+j.경로:'')+(j.note?' | '+j.note:''));
  }
  return lines.join('\n');
}
$('#showOut').addEventListener('click',()=>{
  let box=$('#outBox');
  if (box){ box.remove(); return; }
  const ta=el('textarea',{id:'out',readonly:true}); ta.value=textOut();
  const cp=el('button',{class:'btn',type:'button',text:'복사',onclick:async(e)=>{try{await navigator.clipboard.writeText(ta.value);e.target.textContent='복사됨'}catch(_){ta.select();e.target.textContent='선택됨 — 복사하세요'}}});
  box=el('section',{id:'outBox',class:'card'}, el('h3',{text:'결과 글'}), el('p',{class:'meta',text:'저장이 「이 브라우저에만」일 때 이 글을 복사해 채팅에 붙여 주세요.'}), ta, cp);
  $('#main').prepend(box); window.scrollTo({top:0});
});

render();
setSave('none');
(async()=>{
  let d=null;
  try { d = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch(_) { d=null; }
  if (!d) { setSave('local'); return; }
  db=d; setSave('db');
  db.collection('judgments').onSnapshot(snap=>{
    let changed=false;
    for (const doc of snap.docs) { const b=doc.data(); if (!b) continue; const k=b.key||doc.id; const cur0=state[k]; if (!cur0 || (b.at||'')>(cur0.at||'')) { const {key,...rest}=b; state[k]=rest; changed=true; } }
    if (changed) { saveLocal(); render(); }
  }, ()=>setSave('local'));
})();
</script>
