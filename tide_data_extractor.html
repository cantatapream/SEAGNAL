<!DOCTYPE html>
<!--
    [파일 용도 설명]
    조석 데이터 CSV를 JavaScript 형식으로 변환하는 추출기
    
    버전: v5.0 (Wide Format CSV 지원 / 가로형 데이터 전용)
    
    [입력 데이터 포맷]
    Cols: 관측소코드, 관측소명, 날짜, 고조1시간, 고조1조위, 저조1시간, 저조1조위, ...
    
    [출력 데이터 포맷]
    window.TIDE_DATA_STORAGE['2026'] = [
      {
        date: 20260101,
        stationCode: 'SO_0564',
        stationName: '국화도',
        highTide1Time: 157, highTide1Level: 626,
        lowTide1Time: 822, lowTide1Level: 105,
        ...
      },
      ...
    ]
-->
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>조석 데이터 추출기 v5.0 (Wide Format)</title>
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: #2d3748;
            margin-bottom: 10px;
            font-size: 2.5em;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .subtitle {
            color: #718096;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 30px;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            transform: translateY(-2px);
        }

        .upload-icon {
            font-size: 4em;
            margin-bottom: 15px;
        }

        .upload-button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 15px;
        }

        input[type="file"] {
            display: none;
        }

        .status {
            background: #f7fafc;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            display: none;
        }

        .status.show {
            display: block;
        }

        .status-item {
            margin: 5px 0;
            color: #4a5568;
        }

        .status-label {
            font-weight: 600;
            color: #2d3748;
        }

        .status-value {
            color: #667eea;
            font-weight: bold;
        }

        .output-section {
            margin-top: 30px;
            display: none;
        }

        .output-section.show {
            display: block;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .output-title {
            font-size: 1.5em;
            color: #2d3748;
            font-weight: 600;
        }

        .output-area {
            background: #2d3748;
            color: #e2e8f0;
            padding: 20px;
            border-radius: 10px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 500px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .copy-button {
            background: linear-gradient(135deg, #48bb78, #38a169);
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
        }

        h3.year-title {
            color: #cbd5e0;
            margin-top: 20px;
            border-bottom: 1px solid #4a5568;
            padding-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🌊 조석 데이터 추출기 v5.0 (Wide)</h1>
        <p class="subtitle">Wide Format(가로형) CSV 지원 - 날짜, 고조1, 저조1 한 줄 파싱</p>

        <div class="upload-area" onclick="document.getElementById('fileInput').click()">
            <div class="upload-icon">📊</div>
            <div class="upload-text">Wide Format CSV 파일 선택</div>
            <button class="upload-button">파일 선택</button>
            <input type="file" id="fileInput" accept=".csv" multiple />
        </div>

        <div class="status" id="status">
            <div class="status-item"><span class="status-label">파일:</span> <span class="status-value"
                    id="fileName">-</span></div>
            <div class="status-item"><span class="status-label">기간:</span> <span class="status-value"
                    id="dataPeriod">-</span></div>
            <div class="status-item"><span class="status-label">총 레코드:</span> <span class="status-value"
                    id="totalRecords">-</span></div>
        </div>

        <div class="output-section" id="outputSection">
            <div class="output-header">
                <div class="output-title">📋 변환 결과</div>
                <div id="downloadButtons"></div>
            </div>
            <div class="output-area" id="outputArea"></div>
        </div>
    </div>

    <script>
        document.getElementById('fileInput').addEventListener('change', handleFiles);

        async function handleFiles(e) {
            const files = Array.from(e.target.files);
            if (files.length === 0) return;

            document.getElementById('fileName').textContent = `${files.length}개 파일 처리 중...`;
            document.getElementById('status').classList.add('show');
            document.getElementById('outputSection').classList.add('show');
            document.getElementById('outputArea').innerHTML = '<p style="color: #4a5568;">데이터 분석 중...</p>';

            try {
                let allRows = [];
                for (const file of files) {
                    const data = await readFileAsArrayBuffer(file);
                    // XLSX를 사용하여 인코딩(BOM, EUC-KR 등) 문제를 방지
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const rows = XLSX.utils.sheet_to_json(worksheet, { defval: "", raw: false });
                    allRows = allRows.concat(rows);
                }

                console.log('Total rows parsed:', allRows.length);

                // Wide Format 데이터 처리 (핵심 로직)
                const yearData = processWideFormatData(allRows);

                // 결과 표시
                displayResultsByYear(yearData);
                document.getElementById('fileName').textContent = `${files.length}개 파일 완료`;

                if (Object.keys(yearData).length === 0) {
                    document.getElementById('outputArea').innerHTML = '<p style="color: #e53e3e;">추출된 데이터가 없습니다. CSV 파일의 헤더(관측소코드, 날짜, 고조1시간 등)를 확인해주세요.</p>';
                }

            } catch (error) {
                console.error(error);
                alert(`오류 발생: ${error.message}`);
                document.getElementById('outputArea').innerHTML = `<p style="color: #e53e3e;">오류 발생: ${error.message}</p>`;
            }
        }

        function readFileAsArrayBuffer(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = (e) => resolve(e.target.result);
                reader.onerror = (e) => reject(e);
                reader.readAsArrayBuffer(file);
            });
        }

        // 기존 parseCSV는 사용하지 않으므로 제거하거나 무시해도 됨

        // --- Core Logic: Wide Format -> App Data Format ---
        function processWideFormatData(rows) {
            const yearResults = {};

            rows.forEach(row => {
                // 필수 필드 확인: 관측소코드, 날짜 (헤더 이름에서 BOM이나 공백 가능성 배제)
                const cleanRow = {};
                Object.keys(row).forEach(k => cleanRow[k.trim()] = row[k]);

                const stationCode = cleanRow['관측소코드'] || cleanRow['StationCode'];
                const stationName = cleanRow['관측소명'] || cleanRow['StationName'];
                const dateRaw = cleanRow['날짜'] || cleanRow['Date'];

                if (!stationCode || dateRaw === undefined || dateRaw === null) return;

                let dateInt;
                let year;

                // 날짜 처리 (Excel 시리얼 번호 대응)
                if (typeof dateRaw === 'number' && dateRaw < 100000) {
                    // Excel 시리얼 날짜 (예: 46022 -> 2026-01-01)
                    const dateObj = XLSX.SSF.parse_date_code(dateRaw);
                    const y = dateObj.y;
                    const m = String(dateObj.m).padStart(2, '0');
                    const d = String(dateObj.d).padStart(2, '0');
                    dateInt = parseInt(`${y}${m}${d}`);
                    year = String(y);
                } else {
                    // 문자열 기반 처리
                    const dateRawStr = String(dateRaw);
                    dateInt = parseInt(dateRawStr.replace(/[^0-9]/g, ''));
                    if (isNaN(dateInt)) return;

                    const dateStr = String(dateInt);
                    if (dateStr.length === 8) {
                        year = dateStr.substring(0, 4);
                    } else if (dateStr.length === 5 || dateStr.length === 6) {
                        // 혹시라도 시리얼 번호가 숫자가 아닌 문자열로 오고 있을 경우 대비
                        const serial = parseInt(dateStr);
                        if (serial < 100000) {
                            const dateObj = XLSX.SSF.parse_date_code(serial);
                            const y = dateObj.y;
                            const m = String(dateObj.m).padStart(2, '0');
                            const d = String(dateObj.d).padStart(2, '0');
                            dateInt = parseInt(`${y}${m}${d}`);
                            year = String(y);
                        } else {
                            return; // 알 수 없는 포맷
                        }
                    } else {
                        return; // 알 수 없는 포맷
                    }
                }

                if (!yearResults[year]) yearResults[year] = [];

                // 2. 레코드 생성
                const record = {
                    date: dateInt,
                    stationName: String(stationName || '').trim(),
                    stationCode: String(stationCode).trim()
                };

                // 3. 고조/저조 데이터 매핑
                const mapTide = (prefix, targetKeyPrefix) => {
                    for (let i = 1; i <= 4; i++) {
                        const timeCol = `${prefix}${i}시간`;
                        const levelCol = `${prefix}${i}조위`;

                        const timeRaw = cleanRow[timeCol];
                        const levelRaw = cleanRow[levelCol];

                        if (timeRaw !== undefined && timeRaw !== null && timeRaw !== "") {
                            const timeInt = parseTimeToInt(timeRaw);
                            const levelInt = (levelRaw !== undefined && levelRaw !== null && levelRaw !== "") ?
                                parseInt(String(levelRaw).replace(/,/g, '')) : NaN;

                            if (timeInt !== null && !isNaN(levelInt)) {
                                record[`${targetKeyPrefix}${i}Time`] = timeInt;
                                record[`${targetKeyPrefix}${i}Level`] = levelInt;
                            }
                        }
                    }
                };

                mapTide('고조', 'highTide');
                mapTide('저조', 'lowTide');

                // 데이터가 하나라도 있어야 함 (date, name, code 외)
                if (Object.keys(record).length > 3) {
                    yearResults[year].push(record);
                }
            });

            return yearResults;
        }

        function parseTimeToInt(timeStr) {
            if (timeStr === undefined || timeStr === null || timeStr === "") return null;

            // Excel 시리얼 시간 처리 (0.0 ~ 1.0 사이의 소수점 또는 1 이상의 시리얼 포함)
            if (typeof timeStr === 'number') {
                const dateObj = XLSX.SSF.parse_date_code(timeStr);
                return dateObj.H * 100 + dateObj.M;
            }

            let timePart = String(timeStr).trim();

            // 날짜와 시간이 함께 있는 경우
            if (timePart.includes(' ')) {
                const parts = timePart.split(' ');
                timePart = parts[parts.length - 1];
            }

            const hm = timePart.split(':');
            if (hm.length < 2) {
                // 숫자로만 된 경우 (예: "0157" 또는 "157")
                const num = parseInt(timePart.replace(/[^0-9]/g, ''));
                if (!isNaN(num) && num < 2400) return num;
                return null;
            }

            const h = parseInt(hm[0]);
            const m = parseInt(hm[1]);

            if (isNaN(h) || isNaN(m)) return null;

            return h * 100 + m;
        }

        // --- UI Display ---
        function displayResultsByYear(yearData) {
            const outputArea = document.getElementById('outputArea');
            const btnContainer = document.getElementById('downloadButtons');
            outputArea.innerHTML = '';
            btnContainer.innerHTML = '';

            const years = Object.keys(yearData).sort();
            let totalCount = 0;
            const allDates = [];

            years.forEach(year => {
                const data = yearData[year];
                totalCount += data.length;
                data.forEach(d => allDates.push(d.date));

                // 다운로드 버튼
                const btn = document.createElement('button');
                btn.className = 'copy-button';
                btn.style.marginRight = '10px';
                btn.textContent = `💾 ${year}년 데이터 다운로드`;
                btn.onclick = () => downloadFile(year, data);
                btnContainer.appendChild(btn);

                // 미리보기
                const title = document.createElement('h3');
                title.className = 'year-title';
                title.textContent = `📅 ${year}년 (${data.length}건)`;
                outputArea.appendChild(title);

                const pre = document.createElement('div');
                pre.textContent = generateJsCode(year, data).substring(0, 500) + '\n... (생략) ...';
                outputArea.appendChild(pre);
            });

            document.getElementById('totalRecords').textContent = `${totalCount}건`;
            if (allDates.length > 0) {
                const minD = Math.min(...allDates);
                const maxD = Math.max(...allDates);
                document.getElementById('dataPeriod').textContent = `${minD} ~ ${maxD}`;
            }
        }

        function generateJsCode(year, data) {
            return `// 조석 데이터 ${year}년 (Wide Format 변환됨 - v5.0)
// 생성 일시: ${new Date().toLocaleString()}
// 총 ${data.length}건

if (!window.TIDE_DATA_STORAGE) window.TIDE_DATA_STORAGE = {};
window.TIDE_DATA_STORAGE['${year}'] = ${JSON.stringify(data, null, 2)};`;
        }

        function downloadFile(year, data) {
            const content = generateJsCode(year, data);
            const blob = new Blob([content], { type: 'text/javascript;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `tide_data_${year}.js`;
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>

</html>
