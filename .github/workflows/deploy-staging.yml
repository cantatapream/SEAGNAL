# deploy-staging.yml - SEAGNAL 스테이징 서버 자동 배포
#
# [용도] staging 브랜치에 push 시 seagnal-staging.fly.dev 에 자동 배포
# [연계] fly.staging.toml 설정 파일 사용
# [주의] 프로덕션(deploy.yml → main 브랜치)과 완전히 독립적

name: Deploy to Staging

on:
  push:
    branches:
      - staging

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy staging app
    runs-on: ubuntu-latest
    concurrency: deploy-staging-group
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io Staging
        id: deploy
        run: flyctl deploy --config fly.staging.toml --remote-only 2>&1 | tee deploy.log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get deployment status and logs on failure
        if: failure()
        run: |
          echo "========================================="
          echo "  STAGING DEPLOYMENT FAILED - Collecting logs"
          echo "========================================="
          echo ""
          echo "--- Deploy Output ---"
          cat deploy.log || echo "No deploy log found"
          echo ""
          echo "--- Recent App Logs ---"
          flyctl logs --app seagnal-staging 2>/dev/null | tail -100 || echo "Could not fetch app logs"
          echo ""
          echo "--- App Status ---"
          flyctl status --app seagnal-staging 2>/dev/null || echo "Could not fetch app status"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let deployLog = '';
            try {
              deployLog = fs.readFileSync('deploy.log', 'utf8');
              const lines = deployLog.split('\n');
              if (lines.length > 50) {
                deployLog = '...(truncated)\n' + lines.slice(-50).join('\n');
              }
            } catch (e) {
              deployLog = 'Deploy log not available';
            }

            const title = `[자동] 스테이징 배포 실패 - ${new Date().toISOString().slice(0, 16)}`;
            const body = `## 스테이징 배포 실패 알림

            **커밋:** ${context.sha.slice(0, 7)} by ${context.actor}
            **브랜치:** ${context.ref}
            **워크플로우:** [Actions 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### 배포 로그
            \`\`\`
            ${deployLog}
            \`\`\`

            > 이 이슈는 GitHub Actions에서 자동 생성되었습니다.
            `.replace(/^            /gm, '');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'staging']
            });
