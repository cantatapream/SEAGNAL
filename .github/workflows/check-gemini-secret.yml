name: check-gemini-secret
on:
  push:
    branches:
      - claude/github-readme-masterplan-check-fqkq7z
    paths:
      - '.github/workflows/check-gemini-secret.yml'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check GEMINI_API_KEY presence (value never printed)
        env:
          K1: ${{ secrets.GEMINI_API_KEY }}
          K2: ${{ secrets.GEMINI_API_KEY_2 }}
        run: |
          if [ -n "$K1" ]; then echo "GEMINI_API_KEY: SET (len=${#K1})"; else echo "GEMINI_API_KEY: NOT SET"; fi
          if [ -n "$K2" ]; then echo "GEMINI_API_KEY_2: SET (len=${#K2})"; else echo "GEMINI_API_KEY_2: NOT SET"; fi
