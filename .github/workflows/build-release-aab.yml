name: Build Release AAB (스토어용)

# Play 스토어에 올리는 서명된 앱 파일(AAB)을 만든다. 사람이 Actions 화면에서 [Run workflow] 를 눌러야만 돈다.
# 산출물: Actions 실행 → Artifacts 의 seagnal-release-aab (그 안의 .aab 를 Play 콘솔 「내부 테스트」에 올린다).
#
# [서명]
#   키 파일   : 저장소의 android/seagnal-release-key (PKCS12 · alias key0 · 2026-02-14 생성) — 사용자가 준 릴리즈 키와 같은 파일이다
#               (2026-11-20 파일 지문 대조). apk_build/android.keystore 는 다른 옛 키다 — 쓰지 않는다.
#   비밀번호  : 깃허브 Settings → Secrets and variables → Actions 의 ANDROID_KEYSTORE_PASSWORD
#               (키 비밀번호를 따로 정했으면 ANDROID_KEY_PASSWORD 도 — 없으면 위 값을 같이 쓴다)
#   ⚠이 저장소는 공개 저장소인데 키 파일이 들어 있다(이 절차가 넣은 것이 아니다 — 전부터 있었다).
#     키 파일을 저장소에서 빼기로 하면: 파일을 base64 글자로 바꿔 Secrets 의 ANDROID_KEYSTORE_BASE64 에 등록한다.
#     그 값이 있으면 이 절차는 저장소 파일 대신 그것을 쓴다.
#   비밀번호는 로그에 찍지 않는다(환경변수로만 넘긴다: -storepass:env). 키의 별칭(alias)은 키 파일에서 읽는다.
#   android/app/build.gradle 에는 서명 설정을 넣지 않았다 — 서명 없는 번들을 만든 뒤 여기서 jarsigner 로 서명한다.
#
# [준비 단계는 build-apk.yml(시험용 APK)과 같다] npm install → cap sync 를 빼면 플러그인·서버 주소가 빠진 앱이 나온다
#   (00_docs/operations/app-release-headsup-inapp-update.md §5-3).
# [사용자 요청 2026-11-20] 「깃허브에서 할 수 있도록 해줄래 ?」

on:
  workflow_dispatch: {}

jobs:
  build-release-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KS_REPO_FILE: android/seagnal-release-key
      KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 5분 넘게 빌드한 뒤에야 "비밀번호가 틀렸다"를 알게 되지 않도록 맨 먼저 본다.
      - name: Check signing key (키·비밀번호 등록·일치 확인)
        id: key
        run: |
          if [ -z "$KS_PASS" ]; then
            echo "::error::깃허브 Secrets 에 ANDROID_KEYSTORE_PASSWORD 가 없다 — Settings → Secrets and variables → Actions 에 등록한 뒤 다시 실행"
            exit 1
          fi
          KS="$RUNNER_TEMP/release.keystore"
          if [ -n "$KS_B64" ]; then
            echo "키 파일: Secrets 의 ANDROID_KEYSTORE_BASE64"
            if ! printf '%s' "$KS_B64" | tr -d ' \r\n' | base64 -d > "$KS" 2>/dev/null || [ ! -s "$KS" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 를 키 파일로 되돌리지 못했다 — 붙여 넣다 잘렸을 수 있다(처음부터 끝까지 다시 복사해 등록)"
              exit 1
            fi
          elif [ -f "$KS_REPO_FILE" ]; then
            echo "키 파일: 저장소의 $KS_REPO_FILE"
            cp "$KS_REPO_FILE" "$KS"
          else
            echo "::error::키 파일이 없다 — 저장소에 $KS_REPO_FILE 도 없고 Secrets 에 ANDROID_KEYSTORE_BASE64 도 없다"
            exit 1
          fi
          if ! INFO=$(keytool -list -v -keystore "$KS" -storepass:env KS_PASS 2>&1); then
            echo "$INFO" | grep -i 'error' || true
            if echo "$INFO" | grep -q 'password was incorrect'; then
              echo "::error::키 파일을 못 열었다 — ANDROID_KEYSTORE_PASSWORD 가 맞지 않는다(다시 등록한 뒤 실행)"
            else
              echo "::error::키 파일을 못 읽었다 — 키 파일이 깨졌다(ANDROID_KEYSTORE_BASE64 를 썼다면 잘렸거나 다른 글자가 섞였다)"
            fi
            exit 1
          fi
          N=$(echo "$INFO" | grep -c '^Alias name:' || true)
          test "$N" = "1" || { echo "::error::키 파일 안의 키가 1개가 아니다($N개) — 어느 것을 쓸지 정할 수 없다"; exit 1; }
          ALIAS=$(echo "$INFO" | grep -m1 '^Alias name:' | sed 's/^Alias name: *//')
          SHA256=$(echo "$INFO" | grep -m1 'SHA256:' | awk '{print $2}')
          test -n "$ALIAS" && test -n "$SHA256" || { echo "::error::키의 별칭·인증서 지문을 못 읽었다"; exit 1; }
          echo "키 별칭(alias)   : $ALIAS"
          echo "키 인증서 SHA-1  : $(echo "$INFO" | grep -m1 'SHA1:' | awk '{print $2}')   ← Play 콘솔의 「업로드 키 인증서」 지문과 견준다"
          echo "키 인증서 SHA-256: $SHA256"
          echo "file=$KS" >> "$GITHUB_OUTPUT"
          echo "alias=$ALIAS" >> "$GITHUB_OUTPUT"
          echo "sha256=$SHA256" >> "$GITHUB_OUTPUT"

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # build-apk.yml 과 같은 까닭으로 packages 를 명시한다(기본값의 'tools' 꾸러미가 러너에 없다).
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies
        run: npm install

      - name: Prepare placeholder web assets (app loads remote server.url at runtime)
        run: |
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><title>SEA:GNAL</title><body>loading…</body>' > www/index.html

      - name: Capacitor sync (register native plugins into android project)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release bundle (서명 전)
        working-directory: android
        run: ./gradlew bundleRelease --stacktrace --no-daemon

      # build-apk.yml 의 병합 매니페스트 검사와 같은 항목(release 판) + 출시본 전용 항목(debuggable 없음).
      #   ★검사 항목을 바꾸면 build-apk.yml 쪽도 같이 바꾼다.
      - name: Check merged manifest (마이크 권한 없음 · 헤드업 기본 채널 있음 · debuggable 없음)
        id: manifest
        working-directory: android
        run: |
          M=$(find app/build/intermediates/merged_manifests/release -name AndroidManifest.xml | head -1)
          echo "merged manifest: $M"
          test -n "$M" || { echo "::error::병합 매니페스트를 못 찾았다"; exit 1; }
          VN=$(grep -o 'android:versionName="[^"]*"' "$M" | head -1 | cut -d'"' -f2)
          VC=$(grep -o 'android:versionCode="[^"]*"' "$M" | head -1 | cut -d'"' -f2)
          echo "versionName=$VN · versionCode=$VC"
          test -n "$VN" && test -n "$VC" || { echo "::error::버전을 못 읽었다"; exit 1; }
          echo "vn=$VN" >> "$GITHUB_OUTPUT"
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          FLAT=$(tr '\n' ' ' < "$M")
          PERMS=$(echo "$FLAT" | grep -o '<uses-permission[^>]*>' | grep -o 'android:name="[^"]*"' | sed 's/android:name=//' | sort -u)
          echo "── 권한(uses-permission) 전체 ──"
          echo "$PERMS"
          test -n "$PERMS" || { echo "::error::권한 목록을 못 읽었다(검사가 아무것도 안 본 것이다)"; exit 1; }
          if echo "$PERMS" | grep -E 'RECORD_AUDIO|FOREGROUND_SERVICE_MICROPHONE|FOREGROUND_SERVICE_DATA_SYNC'; then
            echo "::error::마이크·음성 모델 권한이 병합 매니페스트에 남아 있다"; exit 1
          fi
          echo "✅ 마이크·음성 모델 권한 없음"
          # ★2026-11-20 백그라운드 위치·전경 서비스 권한이 있으면 Play 가 정식 출시 전에 신고서를 요구한다(위치 기반 기능은 관리자 전용이라 검토 통과가 어렵다).
          #   사용자 지시로 뺐다 — 일반 공개할 때 신고서와 함께 되살리면서 이 검사도 고친다.
          if echo "$PERMS" | grep -E 'ACCESS_BACKGROUND_LOCATION|FOREGROUND_SERVICE'; then
            echo "::error::백그라운드 위치·전경 서비스 권한이 병합 매니페스트에 남아 있다 — Play 신고서 없이는 정식 출시가 막힌다"; exit 1
          fi
          echo "✅ 백그라운드 위치·전경 서비스 권한 없음"
          grep -A2 'com.google.firebase.messaging.default_notification_channel_id' "$M" | grep -q 'seagnal_push_high' \
            || { echo "::error::헤드업 기본 채널 meta-data(seagnal_push_high)가 없다"; exit 1; }
          echo "✅ 헤드업 기본 채널 meta-data 있음"
          grep -q 'android:name="com.seagnal.app.SeagnalApplication"' "$M" \
            || { echo "::error::Application 클래스(SeagnalApplication) 지정이 없다"; exit 1; }
          echo "✅ SeagnalApplication 지정 있음"
          echo "── 기기 기능(uses-feature) ──"
          # ★2026-11-20 필수로 선언된 기능이 하나라도 있으면 실패시킨다. 플러그인이 끼워 넣은 GPS 필수 선언 때문에
          #   Play 가 GPS 없는 기기(태블릿 35%·크롬북 전부)를 지원에서 뺐다(1.3.0/15 내부 테스트 경고). 매니페스트에서 required="false" 로 덮어썼다.
          #   정말로 필수인 기능이 생기면 이 검사를 그 기능만 허용하도록 고친다.
          # 주석(<!-- … -->)을 먼저 걷어 낸다 — 소스 매니페스트의 설명 주석에 태그 글자가 그대로 들어 있어 주석을 태그로 세었다(run #46).
          grep -n 'uses-feature\|location\.gps' "$M" || true
          FEATURES=$(perl -0pe 's/<!--.*?-->//gs' "$M" | tr '\n' ' ' | grep -o '<uses-feature[^>]*>' || true)
          echo "${FEATURES:-(없음)}"
          if echo "$FEATURES" | grep -v '^$' | grep -v 'android:required="false"'; then
            echo "::error::필수(required)로 선언된 기기 기능이 있다 — 그 기능이 없는 기기는 Play 에서 업데이트를 못 받는다"; exit 1
          fi
          echo "✅ 필수로 선언된 기기 기능 없음"
          SERVICES=$(echo "$FLAT" | grep -o '<service[^>]*>' | grep -o 'android:name="[^"]*"' | sed 's/android:name=//' | sort -u)
          echo "── 서비스 ──"
          echo "$SERVICES"
          echo "$SERVICES" | grep -q 'com.seagnal.app.locationalert.LocationAlertMessagingService' \
            || { echo "::error::푸시 수신 서비스(LocationAlertMessagingService)가 병합 매니페스트에 없다"; exit 1; }
          if echo "$SERVICES" | grep -E 'VoiceAssistantService|VoskDownloadService'; then
            echo "::error::지운 음성 서비스가 병합 매니페스트에 남아 있다"; exit 1
          fi
          echo "✅ 푸시 수신 서비스 있음 · 음성 서비스 없음"
          if echo "$FLAT" | grep -q 'android:debuggable="true"'; then
            echo "::error::출시본인데 debuggable 이 켜져 있다"; exit 1
          fi
          echo "✅ debuggable 꺼짐"
          C=app/src/main/assets/capacitor.config.json
          grep -q '"alert"' "$C" || { echo "::error::capacitor.config.json 에 presentationOptions alert 가 없다(cap sync 누락?)"; exit 1; }
          grep -q 'seagnal-server.fly.dev' "$C" || { echo "::error::capacitor.config.json 에 서버 주소가 없다(cap sync 누락?)"; exit 1; }
          echo "✅ capacitor.config.json(서버 주소·알림 표시 설정) 있음"

      - name: Sign bundle (서명 + 서명 확인)
        run: |
          SRC=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$SRC" || { echo "::error::번들이 없다: $SRC"; ls -R android/app/build/outputs || true; exit 1; }
          mkdir -p out
          OUT="out/SEAGNAL-${{ steps.manifest.outputs.vn }}-${{ steps.manifest.outputs.vc }}-release.aab"
          cp "$SRC" "$OUT"
          jarsigner -keystore "${{ steps.key.outputs.file }}" -storepass:env KS_PASS -keypass:env KEY_PASS \
            -sigalg SHA256withRSA -digestalg SHA-256 "$OUT" "${{ steps.key.outputs.alias }}" > jarsigner.log 2>&1 \
            || { cat jarsigner.log; echo "::error::서명 실패 — 키 비밀번호를 따로 정했다면 Secrets 에 ANDROID_KEY_PASSWORD 를 등록"; exit 1; }
          jarsigner -verify "$OUT" > verify.log 2>&1 || true
          grep -q 'jar verified' verify.log || { cat verify.log; echo "::error::서명 검증 실패"; exit 1; }
          SIGNED=$(keytool -printcert -jarfile "$OUT" | grep -m1 'SHA256:' | awk '{print $2}')
          echo "번들 서명 인증서 SHA-256: $SIGNED"
          test "$SIGNED" = "${{ steps.key.outputs.sha256 }}" || { echo "::error::번들의 서명이 키 파일의 인증서와 다르다"; exit 1; }
          echo "✅ 서명 확인 — $(basename "$OUT") ($(stat -c %s "$OUT") bytes)"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: seagnal-release-aab
          path: out/*.aab
          if-no-files-found: error
          retention-days: 14
