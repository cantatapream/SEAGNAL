# build-staging-apk.yml - 스테이징 APK 자동 빌드
#
# [용도] GitHub에서 버튼 클릭으로 스테이징 APK 생성 → 다운로드
# [사용법] GitHub → Actions → "Build Staging APK" → Run workflow 클릭

name: Build Staging APK

on:
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  build:
    name: Build Staging APK
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Apply staging config
        run: cp capacitor.config.staging.json capacitor.config.json

      - name: Capacitor sync
        run: npx cap sync android

      - name: Set staging applicationId
        run: |
          sed -i 's/applicationId "com.seagnal.app"/applicationId "com.seagnal.app.staging"/' android/app/build.gradle

      - name: Skip Google Services for staging
        run: |
          sed -i 's/apply plugin: .com.google.gms.google-services./\/\/ skipped for staging/' android/app/build.gradle

      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: staging-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
