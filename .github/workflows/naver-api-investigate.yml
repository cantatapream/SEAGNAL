name: Naver API Investigate (temp, §4-U 조사용)

# 목적: Claude Code 세션의 네트워크 정책(Trusted 등급)이 naver.com/ncloud.com/ntruss.com을
# 차단해 직접 조회가 안 됨 → GitHub Actions 러너(인터넷 제한 없음)를 대신 시켜 실제 API 응답을
# 확인하고, 로그로만 결과를 받아본다. 조사 끝나면 이 워크플로 파일은 삭제한다.
#
# 확정된 사실(api.ncloud-docs.com 공식 문서 원문 확인, 2026-08-16):
#   base host: https://naverapihub.apigw.ntruss.com
#   헤더: X-NCP-APIGW-API-KEY-ID / X-NCP-APIGW-API-KEY
#   /search/v1/encyc(백과사전) · /search/v1/kin(지식iN) · /search/v1/cafearticle(카페글)
#   /search/v1/errata(오타변환, 한/영 자판오류 전용) · /search/v1/blog · /search/v1/webkr

on:
  push:
    branches:
      - claude/github-readme-masterplan-check-fqkq7z
    paths:
      - '.github/workflows/naver-api-investigate.yml'

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 확정된 주소로 실제 호출 테스트
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          BASE="https://naverapihub.apigw.ntruss.com"
          call() {
            local path="$1"; shift
            echo "--- $path ---"
            curl -sS -G "$BASE$path" \
              -H "X-NCP-APIGW-API-KEY-ID: $NAVER_CLIENT_ID" \
              -H "X-NCP-APIGW-API-KEY: $NAVER_CLIENT_SECRET" \
              "$@" -w "\nHTTP:%{http_code}\n"
            echo ""
          }
          echo "===== ① 백과사전(깔때기, 국문사전 <수산> 태그 실림여부 확인) ====="
          call "/search/v1/encyc" --data-urlencode "query=깔때기" --data-urlencode "display=10"

          echo "===== ② 지식iN(깔때기 어구) ====="
          call "/search/v1/kin" --data-urlencode "query=깔때기 어구" --data-urlencode "display=5"

          echo "===== ③ 카페글(깔때기 통발) ====="
          call "/search/v1/cafearticle" --data-urlencode "query=깔때기 통발" --data-urlencode "display=5"

          echo "===== ④ 오타변환(정상단어 — 빈 문자열 나오는지) ====="
          call "/search/v1/errata" --data-urlencode "query=구명조끼"

          echo "===== ⑤ 오타변환(한/영 자판오류 예시: 구명조끼를 영문자판으로 친 것) ====="
          call "/search/v1/errata" --data-urlencode "query=rurwuwhrl"
