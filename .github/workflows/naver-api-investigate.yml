name: Naver API Investigate (temp, §4-U 조사용)

# 목적: services/naver_search.js(§4-U용 신규 모듈)가 실제로 동작하는지 검증한다.
# 이 세션(Claude Code on the web) 환경은 naver.com/ncloud.com/ntruss.com 접속이 막혀 있어
# 이 서버에서 직접 테스트가 안 됨 → GitHub Actions 러너에서 대신 실행하고 로그로 결과만 받는다.
# 조사 끝나면 이 워크플로 파일은 삭제한다.

on:
  push:
    branches:
      - claude/github-readme-masterplan-check-fqkq7z
    paths:
      - '.github/workflows/naver-api-investigate.yml'
      - 'local_server/services/naver_search.js'

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: naver_search.js 모듈 실제 호출 테스트
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          node -e "
          const { correctTypo, searchTermMeaning, domainScore } = require('./local_server/services/naver_search.js');
          (async () => {
            console.log('===== correctTypo(\"구명조끼\") — 오타 아님, 원문 그대로 나와야 정상 =====');
            console.log(await correctTypo('구명조끼'));

            console.log('');
            console.log('===== searchTermMeaning(\"깔때기\") — 도메인 스코어로 정렬됐는지 확인 =====');
            const results = await searchTermMeaning('깔때기', { display: 10 });
            for (const r of results.slice(0, 6)) {
              console.log(\`[score=\${r.score}] (\${r.source}) \${r.title} — \${r.snippet.slice(0,60)}\`);
            }
            console.log('');
            console.log('1위 결과의 score가 8(도메인 태그 매치)인지:', results[0].score === 8 ? 'PASS' : 'FAIL(score=' + results[0].score + ')');
          })().catch(e => { console.error('ERROR:', e.message); process.exit(1); });
          "
