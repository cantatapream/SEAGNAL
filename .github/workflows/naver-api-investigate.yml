name: Naver API Investigate (temp, §4-U 조사용)

# 목적: Claude Code 세션의 네트워크 정책(Trusted 등급)이 naver.com/ncloud.com/ntruss.com을
# 차단해 직접 조회가 안 됨 → GitHub Actions 러너(인터넷 제한 없음)를 대신 시켜 문서·API 응답을
# 확인하고, 로그로만 결과를 받아본다. 조사 끝나면 이 워크플로 파일은 삭제한다.
#
# 사용법:
#   1) 문서만 볼 때: Actions 탭에서 수동 실행(secrets 없어도 동작)
#   2) 실제 인증 호출까지 볼 때: 저장소 Settings → Secrets and variables → Actions 에
#      NAVER_CLIENT_ID · NAVER_CLIENT_SECRET 등록 후 실행

on:
  workflow_dispatch:
    inputs:
      query:
        description: '테스트 검색어'
        required: false
        default: '깔때기'
  push:
    branches:
      - claude/github-readme-masterplan-check-fqkq7z
    paths:
      - '.github/workflows/naver-api-investigate.yml'

jobs:
  investigate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 문서 페이지 원문 가져오기 (브라우저 UA로 재시도)
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
          echo "===== apihub-overview (브라우저 UA) ====="
          curl -sS -L -A "$UA" \
            -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: ko-KR,ko;q=0.9" \
            "https://guide.ncloud-docs.com/docs/apihub-overview" | head -c 15000 || echo "FAILED"
          echo ""
          echo "===== 같은 방식으로 검색 API 상세페이지 후보들 ====="
          for p in apihub-search apihub-api-search apihub-naver-search search-api-guide; do
            echo "--- /docs/$p ---"
            curl -sS -L -A "$UA" -o /dev/null -w "HTTP:%{http_code} FINAL_URL:%{url_effective}\n" \
              "https://guide.ncloud-docs.com/docs/$p"
          done
          echo ""
          echo "===== ncloud.com 콘솔 쪽 API 문서(다른 도메인) 시도 ====="
          curl -sS -L -A "$UA" -o /dev/null -w "HTTP:%{http_code}\n" \
            "https://api.ncloud-docs.com/docs/ai-naver-search-blog" || true

      - name: 인증 없이 후보 엔드포인트 생존 확인
        env:
          Q: ${{ inputs.query || '깔때기' }}
        run: |
          for url in \
            "https://openapi.naver.com/v1/search/encyc.json?query=test" \
            "https://naveropenapi.apigw.ntruss.com/search/v1/encyc?query=test" \
            "https://apihub.apigw.ntruss.com/api/v1/search/encyc?query=test" \
            "https://apigw.ntruss.com/search/v1/encyc?query=test" \
            "https://naveropenapi.apigw.ntruss.com/" \
            "https://apihub.apigw.ntruss.com/" ; do
            echo "--- $url ---"
            curl -sS -m 8 "$url" -w "\nHTTP:%{http_code}\n" 2>&1 | head -c 800
            echo ""
            echo ""
          done

      - name: 인증 호출 테스트 (secrets 등록된 경우에만)
        if: ${{ env.HAS_SECRET == 'yes' }}
        env:
          HAS_SECRET: ${{ secrets.NAVER_CLIENT_ID != '' && 'yes' || 'no' }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          Q: ${{ inputs.query || '깔때기' }}
        run: |
          echo "===== ① 옛 방식(openapi.naver.com, X-Naver-Client-Id) ====="
          curl -sS -G "https://openapi.naver.com/v1/search/encyc.json" \
            -H "X-Naver-Client-Id: $NAVER_CLIENT_ID" \
            -H "X-Naver-Client-Secret: $NAVER_CLIENT_SECRET" \
            --data-urlencode "query=$Q" --data-urlencode "display=5" \
            -w "\nHTTP:%{http_code}\n" || echo "FAILED"
          echo ""
          echo "===== ② 신규 방식(NCP APIGW 헤더) 후보 경로들 ====="
          for url in \
            "https://naveropenapi.apigw.ntruss.com/search/v1/encyc" \
            "https://naveropenapi.apigw.ntruss.com/api/v1/search/encyc" \
            "https://naveropenapi.apigw.ntruss.com/api/v1/search/encyc.json" \
            "https://apihub.apigw.ntruss.com/api/v1/search/encyc" \
            "https://apihub.apigw.ntruss.com/api/v1/search/encyc.json" \
            "https://apihub.apigw.ntruss.com/v1/search/encyc" \
            "https://apihub.apigw.ntruss.com/v1/search/encyc.json" \
            "https://apihub.apigw.ntruss.com/search/v1/encyc" ; do
            echo "--- $url ---"
            curl -sS -G "$url" \
              -H "X-NCP-APIGW-API-KEY-ID: $NAVER_CLIENT_ID" \
              -H "X-NCP-APIGW-API-KEY: $NAVER_CLIENT_SECRET" \
              --data-urlencode "query=$Q" --data-urlencode "display=5" \
              -w "\nHTTP:%{http_code}\n" || echo "FAILED($url)"
            echo ""
          done
          echo "===== ③ 교차 조합: 신규 호스트 + 옛 헤더 이름 ====="
          curl -sS -G "https://naveropenapi.apigw.ntruss.com/search/v1/encyc" \
            -H "X-Naver-Client-Id: $NAVER_CLIENT_ID" \
            -H "X-Naver-Client-Secret: $NAVER_CLIENT_SECRET" \
            --data-urlencode "query=$Q" --data-urlencode "display=5" \
            -w "\nHTTP:%{http_code}\n" || echo "FAILED"
