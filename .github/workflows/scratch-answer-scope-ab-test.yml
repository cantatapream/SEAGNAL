name: scratch-answer-scope-ab-test
on:
  push:
    branches:
      - claude/github-readme-masterplan-check-fqkq7z
    paths:
      - '.github/workflows/scratch-answer-scope-ab-test.yml'

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        working-directory: local_server
        run: npm install @google/genai --no-save
      - name: Run A/B test
        working-directory: local_server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/scratch_answer_scope_ab_test.js
