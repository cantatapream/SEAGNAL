name: Build Debug APK

# 위치 기반 특보 경보 테스트용 디버그 APK 빌드.
# 앱은 server.url(https://seagnal-server.fly.dev)을 로드하는 Capacitor 앱이므로
# 웹 에셋은 placeholder만 두고, 네이티브 플러그인(백그라운드 위치·로컬 알림 등)은 cap sync로 등록한다.
# 산출물: Actions 실행 → Artifacts 에서 seagnal-debug-apk 다운로드.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/idea-review-development-bi9ndm
      - claude/voice-narration-trigger-1usct1   # [임시] 발표 나레이션 네이티브 플레이어 APK 빌드
    paths-ignore:
      - '**.md'
      - '00_docs/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        # ★2026-11-19 `packages` 를 명시한다. 이 액션의 기본값은 'tools platform-tools' 인데, 러너의 cmdline-tools 16.0 에는
        #   'tools' 꾸러미가 더 이상 없어 `sdkmanager tools` 가 "Failed to find package 'tools'" 로 죽는다(run #39 — 컴파일까지 가지 못했다).
        #   필요한 것은 아래 단계가 따로 설치한다.
        with:
          packages: 'platform-tools'

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies (adds new Capacitor plugins)
        # ★2026-09-25 `--legacy-peer-deps` 를 뺐다(2-17) — 그 peer 충돌이 지금은 없다.
        #   빈 폴더 실측(node 22.22.2 · npm 10.9.7): 이 명령 그대로 ERESOLVE 없이 설치된다.
        #   적혀 있던 까닭(`@capacitor/core@8.5.2`)은 이 저장소 범위(`^7.0.0`)에서 나올 수
        #   없는 판이었다 — 오진. 다시 나면 **판을 정렬해서** 고친다, 플래그로 덮지 않는다.
        #   근거: 등록부 `2-17` · `.github/workflows/verify-all-gate.yml` 같은 자리 주석.
        run: npm install

      - name: Prepare placeholder web assets (app loads remote server.url at runtime)
        run: |
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><title>SEA:GNAL</title><body>loading…</body>' > www/index.html

      - name: Capacitor sync (register native plugins into android project)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      # ★2026-11-19 만든 APK 의 "병합 매니페스트"(우리 것 + 모든 플러그인·라이브러리 것을 합친 최종본)를 검사한다.
      #   소스 매니페스트만 봐서는 플러그인이 끼워 넣는 권한을 못 본다(독립 검토 D). 여기서 틀리면 빌드를 실패시킨다.
      #   ①마이크·음성 모델 권한이 없어야 한다(사용자 지시 "마이크가 들어가는 부분은 모두 제거")
      #   ②헤드업용 기본 알림 채널 meta-data 와 Application 클래스가 있어야 한다
      - name: Check merged manifest (마이크 권한 없음 · 헤드업 기본 채널 있음)
        working-directory: android
        run: |
          M=$(find app/build/intermediates/merged_manifests/debug -name AndroidManifest.xml | head -1)
          echo "merged manifest: $M"
          test -n "$M" || { echo "::error::병합 매니페스트를 못 찾았다"; exit 1; }
          echo "── 버전 ──"
          grep -o 'android:version\(Name\|Code\)="[^"]*"' "$M" | sort -u
          echo "── 권한(uses-permission) 전체 ──"
          # 태그가 여러 줄에 걸쳐 있어도 잡히게 한 줄로 편 뒤 uses-permission 태그만 본다(주석 속 낱말에 속지 않게).
          PERMS=$(tr '\n' ' ' < "$M" | grep -o '<uses-permission[^>]*>' | grep -o 'android:name="[^"]*"' | sed 's/android:name=//' | sort -u)
          echo "$PERMS"
          test -n "$PERMS" || { echo "::error::권한 목록을 못 읽었다(검사가 아무것도 안 본 것이다)"; exit 1; }
          if echo "$PERMS" | grep -E 'RECORD_AUDIO|FOREGROUND_SERVICE_MICROPHONE|FOREGROUND_SERVICE_DATA_SYNC'; then
            echo "::error::마이크·음성 모델 권한이 병합 매니페스트에 남아 있다"; exit 1
          fi
          echo "✅ 마이크·음성 모델 권한 없음"
          # ★2026-11-20 백그라운드 위치·전경 서비스 권한이 있으면 Play 가 정식 출시 전에 신고서를 요구한다(위치 기반 기능은 관리자 전용이라 검토 통과가 어렵다).
          #   사용자 지시로 뺐다 — 일반 공개할 때 신고서와 함께 되살리면서 이 검사도 고친다.
          if echo "$PERMS" | grep -E 'ACCESS_BACKGROUND_LOCATION|FOREGROUND_SERVICE'; then
            echo "::error::백그라운드 위치·전경 서비스 권한이 병합 매니페스트에 남아 있다 — Play 신고서 없이는 정식 출시가 막힌다"; exit 1
          fi
          echo "✅ 백그라운드 위치·전경 서비스 권한 없음"
          grep -A2 'com.google.firebase.messaging.default_notification_channel_id' "$M" | grep -q 'seagnal_push_high' \
            || { echo "::error::헤드업 기본 채널 meta-data(seagnal_push_high)가 없다"; exit 1; }
          echo "✅ 헤드업 기본 채널 meta-data 있음"
          grep -q 'android:name="com.seagnal.app.SeagnalApplication"' "$M" \
            || { echo "::error::Application 클래스(SeagnalApplication) 지정이 없다"; exit 1; }
          echo "✅ SeagnalApplication 지정 있음"
          echo "── 기기 기능(uses-feature) ──"
          # ★2026-11-20 필수로 선언된 기능이 하나라도 있으면 실패시킨다. 플러그인이 끼워 넣은 GPS 필수 선언 때문에
          #   Play 가 GPS 없는 기기(태블릿 35%·크롬북 전부)를 지원에서 뺐다(1.3.0/15 내부 테스트 경고). 매니페스트에서 required="false" 로 덮어썼다.
          #   정말로 필수인 기능이 생기면 이 검사를 그 기능만 허용하도록 고친다.
          # 주석(<!-- … -->)을 먼저 걷어 낸다 — 소스 매니페스트의 설명 주석에 태그 글자가 그대로 들어 있어 주석을 태그로 세었다(run #46).
          grep -n 'uses-feature\|location\.gps' "$M" || true
          FEATURES=$(perl -0pe 's/<!--.*?-->//gs' "$M" | tr '\n' ' ' | grep -o '<uses-feature[^>]*>' || true)
          echo "${FEATURES:-(없음)}"
          if echo "$FEATURES" | grep -v '^$' | grep -v 'android:required="false"'; then
            echo "::error::필수(required)로 선언된 기기 기능이 있다 — 그 기능이 없는 기기는 Play 에서 업데이트를 못 받는다"; exit 1
          fi
          echo "✅ 필수로 선언된 기기 기능 없음"
          echo "── 서비스 ──"
          # 태그가 여러 줄에 걸쳐 있다(run #41 에서 이 목록이 비어 나왔다) → 한 줄로 편 뒤 읽는다.
          SERVICES=$(tr '\n' ' ' < "$M" | grep -o '<service[^>]*>' | grep -o 'android:name="[^"]*"' | sed 's/android:name=//' | sort -u)
          echo "$SERVICES"
          echo "$SERVICES" | grep -q 'com.seagnal.app.locationalert.LocationAlertMessagingService' \
            || { echo "::error::푸시 수신 서비스(LocationAlertMessagingService)가 병합 매니페스트에 없다"; exit 1; }
          if echo "$SERVICES" | grep -E 'VoiceAssistantService|VoskDownloadService'; then
            echo "::error::지운 음성 서비스가 병합 매니페스트에 남아 있다"; exit 1
          fi
          echo "✅ 푸시 수신 서비스 있음 · 음성 서비스 없음"
          C=app/src/main/assets/capacitor.config.json
          grep -q '"alert"' "$C" || { echo "::error::capacitor.config.json 에 presentationOptions alert 가 없다(cap sync 누락?)"; exit 1; }
          grep -q 'seagnal-server.fly.dev' "$C" || { echo "::error::capacitor.config.json 에 서버 주소가 없다(cap sync 누락?)"; exit 1; }
          echo "✅ capacitor.config.json(서버 주소·알림 표시 설정) 있음"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seagnal-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
