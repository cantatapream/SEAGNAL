name: Build Debug APK

# 위치 기반 특보 경보 테스트용 디버그 APK 빌드.
# 앱은 server.url(https://seagnal-server.fly.dev)을 로드하는 Capacitor 앱이므로
# 웹 에셋은 placeholder만 두고, 네이티브 플러그인(백그라운드 위치·로컬 알림 등)은 cap sync로 등록한다.
# 산출물: Actions 실행 → Artifacts 에서 seagnal-debug-apk 다운로드.

on:
  workflow_dispatch: {}
  push:
    branches:
      - claude/idea-review-development-bi9ndm
      - claude/voice-narration-trigger-1usct1   # [임시] 발표 나레이션 네이티브 플레이어 APK 빌드
    paths-ignore:
      - '**.md'
      - '00_docs/**'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install JS dependencies (adds new Capacitor plugins)
        # ★2026-09-25 `--legacy-peer-deps` 를 뺐다(2-17) — 그 peer 충돌이 지금은 없다.
        #   빈 폴더 실측(node 22.22.2 · npm 10.9.7): 이 명령 그대로 ERESOLVE 없이 설치된다.
        #   적혀 있던 까닭(`@capacitor/core@8.5.2`)은 이 저장소 범위(`^7.0.0`)에서 나올 수
        #   없는 판이었다 — 오진. 다시 나면 **판을 정렬해서** 고친다, 플래그로 덮지 않는다.
        #   근거: 등록부 `2-17` · `.github/workflows/verify-all-gate.yml` 같은 자리 주석.
        run: npm install

      - name: Prepare placeholder web assets (app loads remote server.url at runtime)
        run: |
          mkdir -p www
          printf '<!doctype html><meta charset="utf-8"><title>SEA:GNAL</title><body>loading…</body>' > www/index.html

      - name: Capacitor sync (register native plugins into android project)
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: seagnal-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
