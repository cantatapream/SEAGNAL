name: Deploy to Fly.io

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4

      # [STEP 0 후속] 서비스 계정 키는 보안상 git 에서 제거됨 (secrets/ 는 gitignore).
      # 배포 시점에 GitHub Actions Secrets 금고에서 꺼내 secrets/ 에 생성한다.
      # → 저장소 Settings > Secrets and variables > Actions 에
      #   FIREBASE_SERVICE_ACCOUNT / GCS_BACKUP_SERVICE_ACCOUNT 두 항목 필요.
      - name: Write service account keys
        run: |
          mkdir -p secrets
          if [ -n "$FIREBASE_KEY" ]; then
            printf '%s' "$FIREBASE_KEY" > secrets/serviceAccountKey.json
            echo "✅ serviceAccountKey.json 생성"
          else
            echo "⚠️ FIREBASE_SERVICE_ACCOUNT 시크릿 없음 — FCM 푸시 비활성 상태로 배포됨"
          fi
          if [ -n "$BACKUP_KEY" ]; then
            printf '%s' "$BACKUP_KEY" > secrets/serviceAccountKey_Backup.json
            echo "✅ serviceAccountKey_Backup.json 생성"
          else
            echo "⚠️ GCS_BACKUP_SERVICE_ACCOUNT 시크릿 없음 — 클라우드 백업 비활성 상태로 배포됨"
          fi
        env:
          FIREBASE_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          BACKUP_KEY: ${{ secrets.GCS_BACKUP_SERVICE_ACCOUNT }}

      # superfly/flyctl-actions@master 아카이브를 GitHub codeload 가 내려받지 못해
      # 배포가 시작 전 실패하던 문제 → 공식 설치 스크립트로 flyctl 직접 설치(액션 의존 제거).
      #
      # [2026-09-09] 그 설치 스크립트 다운로드가 중간에 끊겨(curl exit 18 = 전송이 남은
      # 데이터를 두고 닫힘) 배포가 또 시작 전에 실패했다(run 2080). 같은 워크플로의 8분 전
      # 실행(run 2079)은 성공했으므로 스크립트나 우리 코드 문제가 아니라 전송 실패다.
      # 두 가지를 고쳤다:
      #  ① 파일로 먼저 받고 성공했을 때만 실행한다. 예전 `curl … | sh` 방식은 절반만
      #     내려온 스크립트를 그대로 sh 에 흘려 넣었다(끊긴 지점까지 실행됨).
      #  ② 세 번까지 다시 시도한다(curl 자체 재시도 + 바깥 루프). 그래도 안 되면 실패시킨다.
      # 설치 직후 flyctl version 으로 실제로 쓸 수 있는지 확인해, 망가진 설치가 다음
      # 단계까지 끌려가지 않게 한다.
      - name: Install flyctl
        run: |
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
                 --connect-timeout 20 --max-time 120 \
                 https://fly.io/install.sh -o /tmp/fly-install.sh \
               && sh /tmp/fly-install.sh; then
              break
            fi
            rm -f /tmp/fly-install.sh
            if [ "$i" = 3 ]; then
              echo "::error::flyctl 설치를 세 번 시도했으나 모두 실패했다(다운로드 또는 설치 단계)"
              exit 1
            fi
            echo "flyctl 설치 ${i}회 실패 — 10초 뒤 다시 시도"
            sleep 10
          done
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"
          "$HOME/.fly/bin/flyctl" version

      - name: Deploy to Fly.io
        id: deploy
        run: |
          set -o pipefail
          flyctl deploy --local-only 2>&1 | tee deploy.log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get deployment status and logs on failure
        if: failure()
        run: |
          echo "========================================="
          echo "  DEPLOYMENT FAILED - Collecting logs"
          echo "========================================="
          echo ""
          echo "--- Deploy Output ---"
          cat deploy.log || echo "No deploy log found"
          echo ""
          echo "--- Recent App Logs ---"
          flyctl logs --app seagnal 2>/dev/null | tail -100 || echo "Could not fetch app logs"
          echo ""
          echo "--- App Status ---"
          flyctl status --app seagnal 2>/dev/null || echo "Could not fetch app status"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let deployLog = '';
            try {
              deployLog = fs.readFileSync('deploy.log', 'utf8');
              // Keep only last 50 lines to avoid huge issues
              const lines = deployLog.split('\n');
              if (lines.length > 50) {
                deployLog = '...(truncated)\n' + lines.slice(-50).join('\n');
              }
            } catch (e) {
              deployLog = 'Deploy log not available';
            }

            const title = `[자동] 배포 실패 - ${new Date().toISOString().slice(0, 16)}`;
            const body = `## 배포 실패 알림

            **커밋:** ${context.sha.slice(0, 7)} by ${context.actor}
            **브랜치:** ${context.ref}
            **워크플로우:** [Actions 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### 배포 로그
            \`\`\`
            ${deployLog}
            \`\`\`

            > 이 이슈는 GitHub Actions에서 자동 생성되었습니다.
            `.replace(/^            /gm, '');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'deployment']
            });
