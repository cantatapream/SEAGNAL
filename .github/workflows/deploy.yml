name: Deploy to Fly.io

on:
  push:
    branches:
      - main

permissions:
  contents: read
  issues: write

jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    concurrency: deploy-group
    steps:
      - uses: actions/checkout@v4

      # superfly/flyctl-actions@master 아카이브를 GitHub codeload 가 내려받지 못해
      # 배포가 시작 전 실패하던 문제 → 공식 설치 스크립트로 flyctl 직접 설치(액션 의존 제거).
      - name: Install flyctl
        run: |
          curl -fsSL https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Deploy to Fly.io
        id: deploy
        run: |
          set -o pipefail
          flyctl deploy --local-only 2>&1 | tee deploy.log
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Get deployment status and logs on failure
        if: failure()
        run: |
          echo "========================================="
          echo "  DEPLOYMENT FAILED - Collecting logs"
          echo "========================================="
          echo ""
          echo "--- Deploy Output ---"
          cat deploy.log || echo "No deploy log found"
          echo ""
          echo "--- Recent App Logs ---"
          flyctl logs --app seagnal 2>/dev/null | tail -100 || echo "Could not fetch app logs"
          echo ""
          echo "--- App Status ---"
          flyctl status --app seagnal 2>/dev/null || echo "Could not fetch app status"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Create GitHub Issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let deployLog = '';
            try {
              deployLog = fs.readFileSync('deploy.log', 'utf8');
              // Keep only last 50 lines to avoid huge issues
              const lines = deployLog.split('\n');
              if (lines.length > 50) {
                deployLog = '...(truncated)\n' + lines.slice(-50).join('\n');
              }
            } catch (e) {
              deployLog = 'Deploy log not available';
            }

            const title = `[자동] 배포 실패 - ${new Date().toISOString().slice(0, 16)}`;
            const body = `## 배포 실패 알림

            **커밋:** ${context.sha.slice(0, 7)} by ${context.actor}
            **브랜치:** ${context.ref}
            **워크플로우:** [Actions 로그](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})

            ### 배포 로그
            \`\`\`
            ${deployLog}
            \`\`\`

            > 이 이슈는 GitHub Actions에서 자동 생성되었습니다.
            `.replace(/^            /gm, '');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['bug', 'deployment']
            });
