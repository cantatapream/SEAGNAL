# 임시 시험용 — 네이버 API HUB 뉴스 검색(/search/v1/news)이 우리 키로 실제 호출되는지 확인한다.
# 키 값은 출력하지 않는다(상태코드·건수·제목만). 확인이 끝나면 이 파일을 지운다.
name: naver-news-probe
on:
  push:
    branches: [claude/sharp-albattani-564mwa]
    paths: ['.github/workflows/naver-news-probe.yml']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: news search probe
        env:
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          i, s = os.environ.get('NAVER_CLIENT_ID',''), os.environ.get('NAVER_CLIENT_SECRET','')
          print('key_present', bool(i), bool(s))
          if not (i and s): raise SystemExit(1)
          for q in ['금어기', '해경 단속', '어선 사고', '수상레저']:
              url = 'https://naverapihub.apigw.ntruss.com/search/v1/news?' + urllib.parse.urlencode({'query': q, 'display': 100, 'sort': 'date'})
              req = urllib.request.Request(url, headers={'X-NCP-APIGW-API-KEY-ID': i, 'X-NCP-APIGW-API-KEY': s})
              try:
                  d = json.load(urllib.request.urlopen(req, timeout=20))
              except urllib.error.HTTPError as e:
                  print('==', q, 'HTTP', e.code, e.read()[:300].decode('utf-8', 'replace')); continue
              items = d.get('items', [])
              print('==', q, 'HTTP 200 total', d.get('total'), 'got', len(items), 'fields', sorted(items[0].keys()) if items else [])
              for it in items[:5]:
                  print('  ', it.get('pubDate'), '|', it.get('title'), '|', (it.get('description') or '')[:80], '|', it.get('originallink'))
              if items: print('   oldest_in_page', items[-1].get('pubDate'))
          PY
